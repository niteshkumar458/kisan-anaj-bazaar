let selectedProduct = null;


/* =====================================================
   PRODUCT DISPLAY
===================================================== */

function showProducts(list) {

  const box = document.getElementById("products");

  if (!box) return;

  if (!list.length) {

    box.innerHTML =
      `<div class="card">कोई सामान नहीं मिला।</div>`;

    return;
  }

  box.innerHTML = list.map(function(product) {

    return `

      <div class="product">

        <div class="productBody">

          <span class="badge">
            ${product.category}
          </span>

          <h3>${product.name}</h3>

          <div class="price">
            ₹${product.price}/${product.unit}
          </div>

          <button
            class="action"
            onclick="openOrder('${product.id}')">

            🛒 खरीदें

          </button>

        </div>

      </div>

    `;

  }).join("");
}


/* =====================================================
   ALL PRODUCTS
===================================================== */

function renderProducts() {

  showProducts(PRODUCTS);

}


/* =====================================================
   OPEN ORDER
===================================================== */

window.openOrder = function(id) {

  selectedProduct =
    PRODUCTS.find(function(product) {

      return product.id === id;

    });


  if (!selectedProduct) {

    alert("सामान नहीं मिला।");

    return;
  }


  /*
    ध्यान दें:

    यहाँ customer को PRICE बदलने का
    कोई input नहीं दिया गया है।
  */

  document.getElementById(
    "selectedProductInfo"
  ).innerHTML = `

    <div class="info">

      <h3>${selectedProduct.name}</h3>

      <p>
        कैटेगरी:
        ${selectedProduct.category}
      </p>

      <p>
        कीमत:
        <b>
          ₹${selectedProduct.price}/${selectedProduct.unit}
        </b>
      </p>

    </div>

  `;


  if (typeof showSection === "function") {

    showSection("order");

  }


  calculateOrder();

};


/* =====================================================
   ORDER CALCULATION
===================================================== */

window.calculateOrder = function() {

  if (!selectedProduct) return;


  let quantity =
    Number(
      document.getElementById("orderQuantity").value
    );


  if (!quantity || quantity < 1) {

    quantity = 1;

    document.getElementById(
      "orderQuantity"
    ).value = 1;

  }


  /*
    PRICE हमेशा PRODUCT से आएगी।

    CUSTOMER यहाँ price नहीं डाल सकता।
  */

  const productPrice =
    Number(selectedProduct.price);


  const subtotal =
    productPrice * quantity;


  const deliveryKmElement =
    document.getElementById("deliveryKm");


  const deliveryKm =
    deliveryKmElement
      ? Number(deliveryKmElement.value) || 0
      : 0;


  const deliveryCharge =
    deliveryKm * DELIVERY_RATE_PER_KM;


  const total =
    subtotal + deliveryCharge;


  document.getElementById(
    "orderCalculation"
  ).innerHTML = `

    <p>
      ${selectedProduct.name}:
      ₹${productPrice} × ${quantity}
    </p>

    <p>
      सामान की कीमत:
      ₹${subtotal.toFixed(2)}
    </p>

    <p>
      डिलीवरी:
      ₹${deliveryCharge.toFixed(2)}
    </p>

    <hr>

    <div class="total">

      कुल भुगतान:
      ₹${total.toFixed(2)}

    </div>

  `;

};


/* =====================================================
   UPI PAYMENT
===================================================== */

window.startPayment = function() {

  if (!selectedProduct) {

    alert("पहले सामान चुनें।");

    return;
  }


  const quantity =
    Number(
      document.getElementById("orderQuantity").value
    ) || 1;


  const subtotal =
    selectedProduct.price * quantity;


  const deliveryKmElement =
    document.getElementById("deliveryKm");


  const deliveryKm =
    deliveryKmElement
      ? Number(deliveryKmElement.value) || 0
      : 0;


  const deliveryCharge =
    deliveryKm * DELIVERY_RATE_PER_KM;


  const total =
    subtotal + deliveryCharge;


  const upiURL =
    "upi://pay" +
    "?pa=" +
    encodeURIComponent(BUSINESS_UPI) +
    "&pn=" +
    encodeURIComponent("Kisan Anaj Bazar") +
    "&am=" +
    encodeURIComponent(total.toFixed(2)) +
    "&cu=INR";


  window.location.href = upiURL;

};


/* =====================================================
   INTERNAL COMMISSION
   CUSTOMER को नहीं दिखेगा
===================================================== */

function calculateInternalAmount(subtotal) {

  const commission =
    subtotal * COMMISSION_RATE / 100;


  const sellerAmount =
    subtotal - commission;


  return {

    commission: commission,

    sellerAmount: sellerAmount

  };

}


/* =====================================================
   DELIVERY CHARGE
   ₹10 / KM
===================================================== */

function getDeliveryCharge(km) {

  km = Number(km) || 0;

  return km * DELIVERY_RATE_PER_KM;

}


/* =====================================================
   DELIVERY KM FIELD
===================================================== */

function addDeliveryField() {

  const orderBox =
    document.getElementById("orderCalculation");


  if (!orderBox) return;


  if (
    document.getElementById("deliveryKm")
  ) return;


  const div =
    document.createElement("div");


  div.innerHTML = `

    <label>
      📍 डिलीवरी दूरी
    </label>

    <input
      id="deliveryKm"
      type="number"
      min="0"
      step="0.1"
      placeholder="जैसे 5 KM"
      oninput="calculateOrder()"
    >

    <p class="small">
      🚚 डिलीवरी चार्ज ₹10 प्रति KM
    </p>

  `;


  orderBox.parentNode.insertBefore(
    div,
    orderBox
  );

}
