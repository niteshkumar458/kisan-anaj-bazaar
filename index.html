<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kisan Anaj Bazaar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7fb;color:#222}
header{background:#a80062;color:white;padding:14px;position:sticky;top:0;z-index:5}
.brand{font-size:23px;font-weight:bold}
.tag{font-size:12px;margin:5px 0 10px}
.search{width:100%;padding:12px;border:0;border-radius:8px;font-size:15px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px;background:white}
nav button{white-space:nowrap;border:1px solid #ddd;background:white;padding:9px;border-radius:20px}
.banner{margin:12px;padding:22px;border-radius:12px;background:linear-gradient(120deg,#ffe2f1,#fff0c7)}
.banner h2{margin:0 0 8px;color:#a80062}
.banner p{margin:0 0 12px}
button{cursor:pointer}
.primary{border:0;background:#a80062;color:white;padding:10px 14px;border-radius:7px;font-weight:bold}
.section-title{padding:5px 12px;margin-top:16px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}
.cat{background:white;text-align:center;padding:12px 4px;border-radius:10px;font-size:12px;box-shadow:0 1px 5px #0001}
.cat span{display:block;font-size:25px;margin-bottom:7px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}
.card{background:white;border-radius:10px;overflow:hidden;box-shadow:0 1px 5px #0001}
.photo{height:135px;background:#f1e9f0;display:flex;align-items:center;justify-content:center;font-size:55px}
.info{padding:10px}
.name{font-size:14px;min-height:35px}
.price{font-size:19px;font-weight:bold;margin:7px 0}
.old{color:#888;text-decoration:line-through;font-size:12px;font-weight:normal}
.badge{color:#14803c;font-size:12px}
.card button{width:100%;margin-top:8px}
.bottom{position:sticky;bottom:0;display:flex;justify-content:space-around;background:white;padding:10px 3px;box-shadow:0 -2px 8px #0001}
.bottom button{border:0;background:white;color:#a80062;font-size:12px}
.panel{display:none;background:white;margin:12px;padding:15px;border-radius:10px}
.panel input,.panel select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:7px}
footer{text-align:center;padding:20px;color:#666;font-size:13px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}.categories{grid-template-columns:repeat(6,1fr)}header{padding-left:5%;padding-right:5%}}
</style>
</head>
<body>

<header>
  <div class="brand">🌾 Kisan Anaj Bazaar</div>
  <div class="tag">घर बैठे खरीदें • अपना सामान बेचें</div>
  <input class="search" id="search" placeholder="🔎 सामान खोजें..." oninput="renderProducts()">
</header>

<nav>
  <button onclick="showAll()">सभी सामान</button>
  <button onclick="filterCategory('किसान अनाज बाजार')">किसान बाजार</button>
  <button onclick="filterCategory('किराना और राशन')">किराना</button>
  <button onclick="filterCategory('लेडीज फैशन')">फैशन</button>
  <button onclick="filterCategory('मोबाइल और इलेक्ट्रॉनिक्स')">इलेक्ट्रॉनिक्स</button>
</nav>

<section class="banner">
  <h2>खरीदारी हुई आसान!</h2>
  <p>घर और खेती के सामान एक ही जगह पर।</p>
  <button class="primary" onclick="document.getElementById('productsTitle').scrollIntoView()">अभी खरीदें →</button>
</section>

<h3 class="section-title">🛍️ सभी कैटेगरी</h3>
<div class="categories" id="categories"></div>

<h3 class="section-title" id="productsTitle">🔥 लोकप्रिय सामान</h3>
<div class="products" id="products"></div>

<section class="panel" id="loginPanel">
  <h3>लॉगिन / रजिस्ट्रेशन</h3>
  <input id="userName" placeholder="आपका नाम">
  <input id="userPhone" placeholder="मोबाइल नंबर">
  <input id="userEmail" placeholder="ईमेल">
  <button class="primary" onclick="demoLogin()">आगे बढ़ें</button>
  <p id="loginMessage"></p>
</section>

<section class="panel" id="sellPanel">
  <h3>अपना सामान बेचें</h3>
  <input id="sellName" placeholder="सामान का नाम">
  <select id="sellCategory"></select>
  <input id="sellPrice" type="number" placeholder="कीमत ₹">
  <input id="sellImage" placeholder="फोटो का URL (वैकल्पिक)">
  <button class="primary" onclick="addProduct()">सामान जोड़ें</button>
  <p id="sellMessage"></p>
</section>

<section class="panel" id="cartPanel">
  <h3>🛒 आपका कार्ट</h3>
  <div id="cartItems">कार्ट खाली है।</div>
  <button class="primary" onclick="checkout()">ऑर्डर की जानकारी</button>
  <p id="cartMessage"></p>
</section>

<footer>
  © 2026 Kisan Anaj Bazaar<br>
  हेल्पलाइन: 7042894282
</footer>

<div class="bottom">
  <button onclick="home()">🏠<br>होम</button>
  <button onclick="openPanel('categories')">📂<br>कैटेगरी</button>
  <button onclick="openPanel('sellPanel')">➕<br>बेचें</button>
  <button onclick="openPanel('cartPanel')">🛒 <span id="cartCount">0</span><br>कार्ट</button>
  <button onclick="openPanel('loginPanel')">👤<br>लॉगिन</button>
</div>

<script>
const categories=[
["किराना और राशन","🛒"],["किचन का सामान","🍳"],["घरेलू सफाई","🧹"],
["लेडीज फैशन","👗"],["ब्यूटी और श्रृंगार","💄"],["जेंट्स फैशन","👕"],
["बच्चों का सामान","🧸"],["जूते और चप्पल","👟"],["बैग और एक्सेसरीज़","👜"],
["पर्सनल केयर","🧴"],["घर की सजावट","🏠"],["मोबाइल और इलेक्ट्रॉनिक्स","📱"],
["स्टेशनरी","📚"],["खिलौने और खेल","⚽"],["किसान अनाज बाजार","🌾"],
["खेती और बागवानी","🌱"],["पशुपालन","🐄"],["गिफ्ट और त्योहार","🎁"]
];

let products=[
{name:"बासमती चावल",category:"किसान अनाज बाजार",price:75,icon:"🌾"},
{name:"गेहूं",category:"किसान अनाज बाजार",price:30,icon:"🌾"},
{name:"सरसों",category:"किसान अनाज बाजार",price:65,icon:"🌻"},
{name:"कॉटन कुर्ती",category:"लेडीज फैशन",price:299,icon:"👗"},
{name:"पुरुषों की टी-शर्ट",category:"जेंट्स फैशन",price:199,icon:"👕"},
{name:"किचन कंटेनर",category:"किचन का सामान",price:149,icon:"🍱"},
{name:"स्पोर्ट्स जूते",category:"जूते और चप्पल",price:399,icon:"👟"},
{name:"स्किन केयर किट",category:"ब्यूटी और श्रृंगार",price:249,icon:"🧴"},
{name:"मोबाइल स्टैंड",category:"मोबाइल और इलेक्ट्रॉनिक्स",price:99,icon:"📱"},
{name:"बच्चों का खिलौना",category:"खिलौने और खेल",price:179,icon:"🧸"},
{name:"बीज पैकेट",category:"खेती और बागवानी",price:99,icon:"🌱"},
{name:"किराना पैक",category:"किराना और राशन",price:199,icon:"🛍️"}
];

let cart=[];
let activeCategory="";

function makeCategories(){
 const el=document.getElementById("categories");
 el.innerHTML=categories.map(([name,icon])=>
 `<div class="cat" onclick="filterCategory('${name}')"><span>${icon}</span>${name}</div>`
 ).join("");
 document.getElementById("sellCategory").innerHTML=
 categories.map(([name])=>`<option>${name}</option>`).join("");
}
function renderProducts(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>
 (!activeCategory||p.category===activeCategory)&&
 (p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))
 );
 document.getElementById("products").innerHTML=list.map((p,i)=>`
 <article class="card">
 <div class="photo">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`:p.icon||"🛍️"}</div>
 <div class="info">
 <div class="name">${p.name}</div>
 <div class="price">₹${p.price} <span class="old">₹${Math.round(p.price*1.25)}</span></div>
 <div class="badge">✓ अच्छी कीमत</div>
 <button class="primary" onclick="addCart(${products.indexOf(p)})">कार्ट में डालें</button>
 </div></article>`).join("")||"<p>कोई सामान नहीं मिला।</p>";
}
function filterCategory(name){
 activeCategory=name;renderProducts();
 document.getElementById("productsTitle").scrollIntoView({behavior:"smooth"});
}
function showAll(){activeCategory="";renderProducts()}
function addCart(i){cart.push(products[i]);updateCart();alert("सामान कार्ट में जुड़ गया!")}
function updateCart(){
 document.getElementById("cartCount").textContent=cart.length;
 document.getElementById("cartItems").innerHTML=cart.length?
 cart.map((p,i)=>`<p>${p.name} — ₹${p.price} <button onclick="removeCart(${i})">हटाएँ</button></p>`).join(""):"कार्ट खाली है।";
}
function removeCart(i){cart.splice(i,1);updateCart()}
function openPanel(id){
 document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
 if(id==="categories"){document.getElementById("categories").scrollIntoView({behavior:"smooth"});return}
 document.getElementById(id).style.display="block";
 document.getElementById(id).scrollIntoView({behavior:"smooth"});
}
function home(){document.querySelectorAll(".panel").forEach(p=>p.style.display="none");window.scrollTo({top:0,behavior:"smooth"})}
function demoLogin(){
 const name=document.getElementById("userName").value.trim();
 if(!name){document.getElementById("loginMessage").textContent="कृपया अपना नाम भरें।";return}
 document.getElementById("loginMessage").textContent="डेमो लॉगिन सफल। असली अकाउंट के लिए Firebase जोड़ना होगा।";
}
function addProduct(){
 const name=document.getElementById("sellName").value.trim();
 const price=Number(document.getElementById("sellPrice").value);
 if(!name||price<=0){document.getElementById("sellMessage").textContent="नाम और सही कीमत भरें।";return}
 products.unshift({name,price,category:document.getElementById("sellCategory").value,image:document.getElementById("sellImage").value,icon:"🛍️"});
 document.getElementById("sellMessage").textContent="डेमो में सामान जुड़ गया। लाइव वेबसाइट पर दिखाने के लिए डेटाबेस जोड़ना होगा।";
 renderProducts();
}
function checkout(){
 if(!cart.length){document.getElementById("cartMessage").textContent="पहले कार्ट में सामान जोड़ें।";return}
 document.getElementById("cartMessage").textContent="ऑर्डर कुल: ₹"+cart.reduce((s,p)=>s+p.price,0)+". यह डेमो है; असली ऑर्डर सिस्टम अभी कनेक्ट नहीं है।";
}
makeCategories();renderProducts();updateCart();
</script>
</body>
</html>
