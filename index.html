<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kisan Anaj Bazaar</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#f5f7f5;
  color:#172017
}

header{
  background:#176b35;
  color:#fff;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px #0002
}

.bar{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.brand{
  font-size:21px;
  font-weight:800
}

.brand small{
  display:block;
  font-size:12px;
  font-weight:500;
  opacity:.9
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:700;
  cursor:pointer;
  background:#176b35;
  color:#fff
}

button.secondary{
  background:#e8eee9;
  color:#176b35
}

button.danger{
  background:#b3261e
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

main{
  max-width:1100px;
  margin:auto;
  padding:18px
}

.hero{
  background:linear-gradient(135deg,#e8f6ea,#fff);
  padding:22px;
  border-radius:18px;
  margin-bottom:16px
}

.hero h1{
  font-size:30px;
  margin:0 0 6px
}

h1,h2,h3{
  margin-top:0
}

.muted{
  color:#667166
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:14px
}

.search{
  display:grid;
  grid-template-columns:1fr 180px;
  gap:9px;
  margin:16px 0
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccd5cc;
  border-radius:10px;
  background:#fff;
  font:inherit
}

textarea{
  min-height:90px;
  resize:vertical
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px
}

.card{
  background:#fff;
  border-radius:15px;
  padding:16px;
  box-shadow:0 2px 10px #0000000d;
  border:1px solid #e3e8e3
}

.price{
  font-size:20px;
  font-weight:800;
  color:#176b35
}

.tag{
  display:inline-block;
  background:#edf6ee;
  color:#176b35;
  padding:4px 8px;
  border-radius:99px;
  font-size:12px
}

.hidden{
  display:none!important
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:grid;
  place-items:center;
  padding:16px;
  z-index:50
}

.modalbox{
  background:#fff;
  width:min(600px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  padding:20px
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.field{
  margin:10px 0
}

.notice{
  padding:11px;
  border-radius:10px;
  background:#fff6d8;
  color:#6b5200;
  margin:10px 0
}

.ok{
  background:#e7f7eb;
  color:#135a2d
}

.err{
  background:#fdebea;
  color:#8c1d18
}

.section{
  margin:22px 0
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}

.cart{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#176b35;
  color:white;
  border-radius:99px;
  padding:13px 17px;
  box-shadow:0 5px 20px #0003;
  z-index:20
}

footer{
  text-align:center;
  padding:30px;
  color:#6b756b
}

.small{
  font-size:13px
}

.admin-card{
  border-left:5px solid #176b35
}

.status-pending{
  color:#8a6500;
  font-weight:700
}

.status-approved{
  color:#176b35;
  font-weight:700
}

.status-rejected{
  color:#b3261e;
  font-weight:700
}

@media(max-width:600px){
  .search{
    grid-template-columns:1fr
  }

  .row{
    grid-template-columns:1fr
  }

  .hero h1{
    font-size:24px
  }
}
</style>
</head>

<body>

<header>
  <div class="bar">

    <div class="brand">
      🌾 Kisan Anaj Bazaar
      <small>किसानों से सीधे कृषि सामान खरीदें और बेचें</small>
    </div>

    <div id="headerUser"></div>

  </div>
</header>


<main>

<section class="hero">

  <h1>किसान अनाज बाजार</h1>

  <div class="muted">
    धान, गेहूं, मक्का, दलहन और दूसरे कृषि उत्पाद खरीदें या बेचें।
  </div>

  <div class="actions">

    <button id="loginBtn">
      🔐 Login / Register
    </button>

    <button id="sellBtn" class="secondary">
      🚜 अपना सामान बेचें
    </button>

    <button id="ordersBtn" class="secondary hidden">
      📦 मेरे ऑर्डर
    </button>

    <button id="adminBtn" class="hidden">
      👑 Admin Panel
    </button>

  </div>

  <div id="status" class="notice hidden"></div>

</section>


<section class="section">

  <div class="topline">
    <h2>🌾 उपलब्ध कृषि सामान</h2>
    <span id="productCount" class="muted"></span>
  </div>

  <div class="search">

    <input
      id="search"
      placeholder="🔎 जैसे धान, गेहूं, मक्का..."
    >

    <select id="category">

      <option value="">सभी सामान</option>
      <option>धान</option>
      <option>गेहूं</option>
      <option>मक्का</option>
      <option>दलहन</option>
      <option>सब्जी</option>
      <option>अन्य</option>

    </select>

  </div>

  <div id="products" class="grid"></div>

</section>

</main>


<button id="cartBtn" class="cart">
  🛒 Cart <span id="cartCount">0</span>
</button>


<footer>
© 2026 Kisan Anaj Bazaar
</footer>


<!-- LOGIN / REGISTER -->

<div id="authModal" class="modal hidden">

<div class="modalbox">

  <div class="topline">

    <h2 id="authTitle">
      Login
    </h2>

    <button id="closeAuth" class="secondary">
      ✕
    </button>

  </div>

  <div id="authMessage" class="notice hidden"></div>

  <div class="field">

    <label>ईमेल</label>

    <input
      id="authEmail"
      type="email"
      autocomplete="email"
      placeholder="example@gmail.com"
    >

  </div>

  <div class="field">

    <label>पासवर्ड</label>

    <input
      id="authPassword"
      type="password"
      autocomplete="current-password"
      placeholder="कम से कम 6 अक्षर"
    >

  </div>

  <div id="nameField" class="field hidden">

    <label>नाम</label>

    <input
      id="authName"
      placeholder="आपका नाम"
    >

  </div>

  <div class="actions">

    <button id="authSubmit">
      Login
    </button>

    <button id="switchAuth" class="secondary">
      नया account बनाएं
    </button>

    <button id="resetPassword" class="secondary">
      पासवर्ड भूल गए?
    </button>

  </div>

</div>
</div>


<!-- SELL -->

<div id="sellModal" class="modal hidden">

<div class="modalbox">

  <div class="topline">

    <h2>🚜 सामान बेचें</h2>

    <button id="closeSell" class="secondary">
      ✕
    </button>

  </div>

  <div id="sellMessage" class="notice hidden"></div>

  <div class="field">

    <label>सामान का नाम</label>

    <input
      id="pName"
      placeholder="जैसे बासमती चावल"
    >

  </div>

  <div class="row">

    <div class="field">

      <label>श्रेणी</label>

      <select id="pCategory">

        <option>धान</option>
        <option>गेहूं</option>
        <option>मक्का</option>
        <option>दलहन</option>
        <option>सब्जी</option>
        <option>अन्य</option>

      </select>

    </div>

    <div class="field">

      <label>कीमत ₹/किलो</label>

      <input
        id="pPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="30"
      >

    </div>

  </div>

  <div class="row">

    <div class="field">

      <label>मात्रा (किलो)</label>

      <input
        id="pQty"
        type="number"
        min="0"
        step="0.01"
        placeholder="500"
      >

    </div>

    <div class="field">

      <label>मोबाइल</label>

      <input
        id="pPhone"
        inputmode="numeric"
        maxlength="10"
        placeholder="10 अंकों का मोबाइल"
      >

    </div>

  </div>

  <div class="field">

    <label>किसान का नाम</label>

    <input id="pFarmer">

  </div>

  <div class="field">

    <label>स्थान</label>

    <input
      id="pLocation"
      placeholder="गांव / शहर / जिला"
    >

  </div>

  <div class="field">

    <label>विवरण</label>

    <textarea id="pDescription"></textarea>

  </div>

  <button id="postProduct">
    📤 सामान पोस्ट करें
  </button>

</div>
</div>


<!-- CART -->

<div id="cartModal" class="modal hidden">

<div class="modalbox">

  <div class="topline">

    <h2>🛒 Cart</h2>

    <button id="closeCart" class="secondary">
      ✕
    </button>

  </div>

  <div id="cartItems"></div>

  <hr>

  <h3>
    कुल: ₹<span id="cartTotal">0</span>
  </h3>

  <div class="field">

    <label>खरीदार का नाम</label>

    <input id="buyerName">

  </div>

  <div class="field">

    <label>मोबाइल</label>

    <input
      id="buyerPhone"
      maxlength="10"
      inputmode="numeric"
    >

  </div>

  <div class="field">

    <label>डिलीवरी पता</label>

    <textarea id="buyerAddress"></textarea>

  </div>

  <button id="placeOrder">
    ✅ ऑर्डर भेजें
  </button>

  <div id="orderMessage" class="notice hidden"></div>

</div>
</div>


<!-- ORDERS -->

<div id="ordersModal" class="modal hidden">

<div class="modalbox">

  <div class="topline">

    <h2>📦 मेरे ऑर्डर</h2>

    <button id="closeOrders" class="secondary">
      ✕
    </button>

  </div>

  <div id="myOrders"></div>

</div>
</div>


<!-- ADMIN -->

<div id="adminModal" class="modal hidden">

<div class="modalbox">

  <div class="topline">

    <h2>👑 Admin Panel</h2>

    <button id="closeAdmin" class="secondary">
      ✕
    </button>

  </div>

  <div id="adminMessage" class="notice hidden"></div>

  <div id="adminBox"></div>

</div>
</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  sendPasswordResetEmail,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  doc,
  setDoc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDxjigog6ctxY25UFGrH7M3pYx1IN2RWSw",

  authDomain:
    "kissan-bajar.firebaseapp.com",

  projectId:
    "kissan-bajar",

  storageBucket:
    "kissan-bajar.firebasestorage.app",

  messagingSenderId:
    "629043004551",

  appId:
    "1:629043004551:web:f484c026c838399cff6422"

};


/* =========================
   FIREBASE START
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


const show = el =>
  el.classList.remove("hidden");


const hide = el =>
  el.classList.add("hidden");


function msg(el,text,ok=false){

  el.textContent = text;

  el.className =
    "notice " + (ok ? "ok" : "err");

  show(el);

}


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
    );

}


function cleanEmail(v){

  return v.trim().toLowerCase();

}


/* =========================
   GLOBAL DATA
========================= */

let currentUser = null;

let myProfile = null;

let products = [];

let cart = [];


/* =========================
   AUTH ERROR
========================= */

function authError(code){

  const map = {

    "auth/email-already-in-use":
      "इस ईमेल से account पहले से बना है। Login करें।",

    "auth/invalid-email":
      "ईमेल सही नहीं है।",

    "auth/weak-password":
      "पासवर्ड कम से कम 6 अक्षर का रखें।",

    "auth/invalid-credential":
      "ईमेल या पासवर्ड गलत है।",

    "auth/user-not-found":
      "इस ईमेल से account नहीं मिला।",

    "auth/wrong-password":
      "पासवर्ड गलत है।",

    "auth/too-many-requests":
      "बहुत बार कोशिश हुई है। थोड़ी देर बाद फिर कोशिश करें।",

    "auth/network-request-failed":
      "Internet connection की समस्या है।",

    "auth/operation-not-allowed":
      "Firebase में Email/Password Login enabled नहीं है।"

  };

  return map[code] ||
    ("Login error: " + code);

}


/* =========================
   PROFILE
========================= */

async function getMyProfile(){

  if(!currentUser)
    return null;

  const ref =
    doc(db,"users",currentUser.uid);

  const snap =
    await getDoc(ref);

  if(!snap.exists())
    return null;

  return {
    id:snap.id,
    ...snap.data()
  };

}


/* =========================
   AUTH MODAL
========================= */

function openAuth(mode="login"){

  $("authTitle").textContent =
    mode==="login"
      ? "Login"
      : "Register";

  $("authSubmit").textContent =
    mode==="login"
      ? "Login"
      : "Register";

  $("switchAuth").textContent =
    mode==="login"
      ? "नया account बनाएं"
      : "पहले से account है? Login";

  if(mode==="login")
    hide($("nameField"));
  else
    show($("nameField"));

  $("authMessage").className =
    "notice hidden";

  show($("authModal"));

}


$("loginBtn").onclick = () => {

  if(currentUser)
    signOut(auth);
  else
    openAuth("login");

};


$("closeAuth").onclick = () =>
  hide($("authModal"));


$("switchAuth").onclick = () => {

  const registering =
    $("authTitle").textContent === "Register";

  openAuth(
    registering
      ? "login"
      : "register"
  );

};


$("resetPassword").onclick = async () => {

  const email =
    cleanEmail(
      $("authEmail").value
    );

  if(!email){

    msg(
      $("authMessage"),
      "पहले ईमेल लिखें।"
    );

    return;
  }

  try{

    await sendPasswordResetEmail(
      auth,
      email
    );

    msg(
      $("authMessage"),
      "Password reset email भेज दिया गया है।",
      true
    );

  }catch(e){

    msg(
      $("authMessage"),
      authError(e.code)
    );

  }

};


/* =========================
   REGISTER / LOGIN
========================= */

$("authSubmit").onclick = async () => {

  const email =
    cleanEmail(
      $("authEmail").value
    );

  const pass =
    $("authPassword").value;

  if(
    !email ||
    pass.length < 6
  ){

    msg(
      $("authMessage"),
      "ईमेल और कम से कम 6 अक्षर का पासवर्ड भरें।"
    );

    return;
  }

  $("authSubmit").disabled = true;

  try{

    if(
      $("authTitle").textContent ===
      "Register"
    ){

      const name =
        $("authName").value.trim();

      if(!name){

        msg(
          $("authMessage"),
          "नाम भरें।"
        );

        return;
      }

      const cred =
        await createUserWithEmailAndPassword(
          auth,
          email,
          pass
        );


      await updateProfile(
        cred.user,
        {
          displayName:name
        }
      );


      /*
        IMPORTANT:
        Normal user starts with:
        role = user
        buyPermission = false
        sellPermission = false
      */

      await setDoc(
        doc(
          db,
          "users",
          cred.user.uid
        ),
        {

          uid:cred.user.uid,

          name:name,

          email:email,

          role:"user",

          buyPermission:false,

          sellPermission:false,

          createdAt:
            serverTimestamp()

        },
        {
          merge:true
        }
      );


      msg(
        $("authMessage"),
        "Account बन गया। Admin permission देने के बाद खरीद/बिक्री कर सकेंगे।",
        true
      );


      setTimeout(
        () => hide($("authModal")),
        1000
      );


    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        pass
      );

      msg(
        $("authMessage"),
        "Login सफल।",
        true
      );


      setTimeout(
        () => hide($("authModal")),
        400
      );

    }

  }catch(e){

    msg(
      $("authMessage"),
      authError(e.code)
    );

  }finally{

    $("authSubmit").disabled =
      false;

  }

};


/* =========================
   SELL
========================= */

$("sellBtn").onclick = async () => {

  if(!currentUser){

    openAuth("login");

    return;
  }

  try{

    myProfile =
      await getMyProfile();

  }catch(e){

    msg(
      $("status"),
      "Profile load नहीं हुआ: " +
      e.code
    );

    return;
  }


  if(
    !myProfile ||
    myProfile.sellPermission !== true
  ){

    msg(
      $("status"),
      "आपको अभी सामान बेचने की permission नहीं मिली है। Admin से Sell Permission ON करवाएं।"
    );

    return;
  }


  $("pFarmer").value =
    currentUser.displayName ||
    myProfile.name ||
    "";

  show($("sellModal"));

};


$("closeSell").onclick = () =>
  hide($("sellModal"));


/* =========================
   POST PRODUCT
========================= */

$("postProduct").onclick =
async () => {

  if(!currentUser){

    openAuth("login");

    return;
  }


  myProfile =
    await getMyProfile();


  if(
    !myProfile ||
    myProfile.sellPermission !== true
  ){

    msg(
      $("sellMessage"),
      "Sell Permission अभी OFF है।"
    );

    return;
  }


  const name =
    $("pName").value.trim();

  const category =
    $("pCategory").value;

  const price =
    Number(
      $("pPrice").value
    );

  const quantity =
    Number(
      $("pQty").value
    );

  const phone =
    $("pPhone").value.trim();

  const farmer =
    $("pFarmer").value.trim();

  const location =
    $("pLocation").value.trim();


  if(
    !name ||
    !price ||
    !quantity ||
    !farmer ||
    !/^[0-9]{10}$/.test(phone) ||
    !location
  ){

    msg(
      $("sellMessage"),
      "नाम, कीमत, मात्रा, किसान नाम, 10-अंकों का मोबाइल और स्थान भरें।"
    );

    return;
  }


  $("postProduct").disabled =
    true;


  try{

    /*
      IMPORTANT:
      Firestore Rules के अनुसार
      नया product:
      status = pending
      active = false
    */

    await addDoc(
      collection(
        db,
        "products"
      ),
      {

        name:name,

        category:category,

        price:price,

        quantity:quantity,

        phone:phone,

        farmer:farmer,

        location:location,

        description:
          $("pDescription").value.trim(),

        sellerId:
          currentUser.uid,

        sellerEmail:
          currentUser.email,

        status:"pending",

        active:false,

        createdAt:
          serverTimestamp()

      }
    );


    msg(
      $("sellMessage"),
      "सामान पोस्ट हो गया है। Admin approval के बाद यह बाजार में दिखाई देगा।",
      true
    );


    [
      "pName",
      "pPrice",
      "pQty",
      "pPhone",
      "pLocation",
      "pDescription"
    ].forEach(
      id => $(id).value = ""
    );


  }catch(e){

    msg(
      $("sellMessage"),
      "सामान पोस्ट नहीं हुआ: " +
      (e.code || e.message)
    );

  }finally{

    $("postProduct").disabled =
      false;

/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    let snap;

    try{

      snap =
        await getDocs(
          query(
            collection(
              db,
              "products"
            ),
            orderBy(
              "createdAt",
              "desc"
            )
          )
        );

    }catch(e){

      snap =
        await getDocs(
          collection(
            db,
            "products"
          )
        );

    }


    products =
      snap.docs
      .map(
        d => ({
          id:d.id,
          ...d.data()
        })
      )
      .filter(
        p =>
          p.status === "approved" &&
          p.active === true
      );


    renderProducts();

  }catch(e){

    $("products").innerHTML = `
      <div class="card">
        <b>Products load नहीं हुए।</b>
        <p class="muted">
          ${esc(e.code || e.message)}
        </p>
      </div>
    `;

  }

}
