<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>किसान अनाज बाजार</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f7f2;
  color:#222;
}

header{
  background:#16803c;
  color:white;
  padding:18px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:25px;
}

header p{
  margin-top:6px;
  font-size:14px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}

.menu button{
  border:0;
  padding:18px 10px;
  border-radius:12px;
  background:white;
  box-shadow:0 3px 10px #0002;
  font-size:17px;
  font-weight:bold;
  color:#16803c;
  cursor:pointer;
}

.menu button.active{
  background:#16803c;
  color:white;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.card{
  background:white;
  padding:18px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #0001;
}

.card h2{
  color:#16803c;
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  width:100%;
  border:0;
  background:#16803c;
  color:white;
  padding:13px;
  margin-top:15px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.btn.orange{
  background:#e67e22;
}

.btn.blue{
  background:#1769aa;
}

.btn.red{
  background:#d63031;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}

.product{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px #0002;
}

.product img,
.product video{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
}

.product-body{
  padding:14px;
}

.product-body h3{
  color:#16803c;
  margin-bottom:7px;
}

.price{
  font-size:20px;
  font-weight:bold;
  color:#d35400;
}

.small{
  font-size:13px;
  color:#666;
  margin-top:5px;
}

.hidden{
  display:none;
}

.payment-box{
  background:#eaf8ef;
  border:1px solid #9bd4ae;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.payment-box strong{
  color:#16803c;
}

.order{
  border-left:5px solid #16803c;
  background:#fff;
  padding:15px;
  margin-bottom:12px;
  border-radius:8px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#fff3cd;
  color:#856404;
  font-size:12px;
}

footer{
  text-align:center;
  padding:25px 10px;
  color:#666;
}

@media(max-width:600px){
  header h1{
    font-size:21px;
  }

  .menu button{
    font-size:15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🌾 किसान अनाज बाजार</h1>
  <p>किसान और ग्राहक के बीच सामान खरीदने-बेचने का प्लेटफॉर्म</p>
</header>

<div class="container">

  <!-- MAIN MENU -->

  <div class="menu">
    <button id="buyBtn" class="active" onclick="showSection('buy')">
      🛒 सामान खरीदें
    </button>

    <button id="sellBtn" onclick="showSection('sell')">
      📦 सामान बेचें
    </button>
  </div>


  <!-- ================= BUY ================= -->

  <section id="buy" class="section active">

    <div class="card">
      <h2>🛒 उपलब्ध सामान</h2>

      <input
        type="text"
        id="search"
        placeholder="सामान खोजें जैसे धान, गेहूं, आलू..."
        oninput="searchProducts()"
      >
    </div>

    <div id="productList" class="product-grid"></div>

  </section>


  <!-- ================= SELL ================= -->

  <section id="sell" class="section">

    <div class="card">

      <h2>📦 अपना सामान बेचें</h2>

      <label>सामान का नाम</label>
      <input
        type="text"
        id="productName"
        placeholder="जैसे धान, गेहूं, आलू"
      >

      <label>श्रेणी</label>
      <select id="category">
        <option value="अनाज">अनाज</option>
        <option value="सब्जी">सब्जी</option>
        <option value="फल">फल</option>
        <option value="दाल">दाल</option>
        <option value="अन्य">अन्य</option>
      </select>

      <label>कीमत ₹</label>
      <input
        type="number"
        id="price"
        placeholder="जैसे 2500"
      >

      <label>मात्रा</label>
      <input
        type="text"
        id="quantity"
        placeholder="जैसे 50 किलो"
      >

      <label>आपका नाम</label>
      <input
        type="text"
        id="sellerName"
        placeholder="नाम"
      >

      <label>फोन नंबर</label>
      <input
        type="tel"
        id="sellerPhone"
        placeholder="10 अंकों का नंबर"
      >

      <label>लोकेशन</label>
      <input
        type="text"
        id="location"
        placeholder="गांव / शहर / जिला"
      >

      <label>सामान की जानकारी</label>
      <textarea
        id="description"
        placeholder="सामान की पूरी जानकारी लिखें..."
      ></textarea>

      <label>📷 सामान की फोटो</label>
      <input
        type="file"
        id="productImage"
        accept="image/*"
      >

      <label>🎥 सामान का वीडियो</label>
      <input
        type="file"
        id="productVideo"
        accept="video/*"
      >

      <button class="btn" onclick="addProduct()">
        📤 सामान पोस्ट करें
      </button>

    </div>

  </section>


  <!-- ================= ORDER ================= -->

  <section id="orderSection" class="section">

    <div class="card">
      <h2>🧾 ऑर्डर</h2>
      <div id="orderDetails"></div>
    </div>

  </section>


  <!-- ================= SUPPORT ================= -->

  <div class="card">

    <h2>📞 ग्राहक सहायता</h2>

    <p>
      किसी भी समस्या के लिए Customer Support से संपर्क करें।
    </p>

    <a
      href="tel:7042894282"
      style="text-decoration:none"
    >
      <button class="btn blue">
        📞 7042894282 पर कॉल करें
      </button>
    </a>

  </div>

</div>


<footer>
  © 2026 किसान अनाज बाजार
</footer>


<script>

/* =====================================================
   IMPORTANT SETTINGS
===================================================== */

const SUPPORT_NUMBER = "7042894282";

/*
   अपनी सही UPI ID यहां डालें।
   पिछली दी गई ID:
   niteshai64910@nyes

   अगर बैंक की सही UPI ID अलग है तो इसे बदलें।
*/
const OWNER_UPI = "niteshai64910@nyes";

const COMMISSION_PERCENT = 5;


/* =====================================================
   PRODUCT DATA
===================================================== */

let products = JSON.parse(
  localStorage.getItem("kisanProducts")
) || [

  {
    id:1,
    name:"धान",
    category:"अनाज",
    price:2500,
    quantity:"100 किलो",
    seller:"Demo किसान",
    phone:"0000000000",
    location:"बिहार",
    description:"अच्छी क्वालिटी का धान",
    image:"",
    video:""
  },

  {
    id:2,
    name:"गेहूं",
    category:"अनाज",
    price:2800,
    quantity:"100 किलो",
    seller:"Demo किसान",
    phone:"0000000000",
    location:"बिहार",
    description:"अच्छी क्वालिटी का गेहूं",
    image:"",
    video:""
  }

];


/* =====================================================
   SECTION SWITCH
===================================================== */

function showSection(section){

  document
    .querySelectorAll(".section")
    .forEach(x => x.classList.remove("active"));

  document
    .getElementById(section)
    .classList.add("active");

  document
    .querySelectorAll(".menu button")
    .forEach(x => x.classList.remove("active"));

  if(section === "buy"){
    document
      .getElementById("buyBtn")
      .classList.add("active");
  }

  if(section === "sell"){
    document
      .getElementById("sellBtn")
      .classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =====================================================
   SAVE
===================================================== */

function saveProducts(){

  localStorage.setItem(
    "kisanProducts",
    JSON.stringify(products)
  );

}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(list = products){

  const box =
    document.getElementById("productList");

  box.innerHTML = "";

  if(list.length === 0){

    box.innerHTML = `
      <div class="card">
        <h3>कोई सामान नहीं मिला</h3>
      </div>
    `;

    return;
  }


  list.forEach(product => {

    let media = "";

    if(product.image){

      media += `
        <img
          src="${product.image}"
          alt="${product.name}"
        >
      `;

    }

    if(product.video){

      media += `
        <video
          src="${product.video}"
          controls
        ></video>
      `;

    }


    box.innerHTML += `

      <div class="product">

        ${
          media ||
          `<div style="
            height:190px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#eee;
            font-size:55px;
          ">🌾</div>`
        }

        <div class="product-body">

          <h3>${escapeHTML(product.name)}</h3>

          <div class="price">
            ₹${Number(product.price).toLocaleString("en-IN")}
          </div>

          <div class="small">
            📦 मात्रा: ${escapeHTML(product.quantity)}
          </div>

          <div class="small">
            👤 विक्रेता: ${escapeHTML(product.seller)}
          </div>

          <div class="small">
            📍 ${escapeHTML(product.location)}
          </div>

          <div class="small">
            ${escapeHTML(product.description)}
          </div>

          <button
            class="btn"
            onclick="buyProduct(${product.id})"
          >
            🛒 यह सामान खरीदें
          </button>

        </div>

      </div>

    `;

  });

}


/* =====================================================
   ADD PRODUCT
===================================================== */

function addProduct(){

  const name =
    document.getElementById("productName").value.trim();

  const category =
    document.getElementById("category").value;

  const price =
    Number(document.getElementById("price").value);

  const quantity =
    document.getElementById("quantity").value.trim();

  const seller =
    document.getElementById("sellerName").value.trim();

  const phone =
    document.getElementById("sellerPhone").value.trim();

  const location =
    document.getElementById("location").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const imageFile =
    document.getElementById("productImage").files[0];

  const videoFile =
    document.getElementById("productVideo").files[0];


  if(
    !name ||
    !price ||
    !quantity ||
    !seller ||
    !phone ||
    !location
  ){

    alert("कृपया सभी जरूरी जानकारी भरें।");
    return;

  }


  if(phone.length !== 10){

    alert("कृपया सही 10 अंकों का फोन नंबर डालें।");
    return;

  }


  const product = {

    id:Date.now(),

    name:name,

    category:category,

    price:price,

    quantity:quantity,

    seller:seller,

    phone:phone,

    location:location,

    description:description,

    image:"",

    video:""

  };


  /*
     छोटे फोटो/वीडियो के लिए browser storage demo।
     असली वेबसाइट में Firebase Storage इस्तेमाल करना चाहिए।
  */

  if(imageFile){

    const reader =
      new FileReader();

    reader.onload = function(e){

      product.image =
        e.target.result;

      if(videoFile){

        const videoReader =
          new FileReader();

        videoReader.onload =
          function(v){

            product.video =
              v.target.result;

            products.unshift(product);

            saveProducts();

            displayProducts();

            alert(
              "सामान सफलतापूर्वक पोस्ट हो गया।"
            );

            clearSellForm();

            showSection("buy");

          };

        videoReader.readAsDataURL(videoFile);

      }else{

        products.unshift(product);

        saveProducts();

        displayProducts();

        alert(
          "सामान सफलतापूर्वक पोस्ट हो गया।"
        );

        clearSellForm();

        showSection("buy");

      }

    };

    reader.readAsDataURL(imageFile);

  }else{

    products.unshift(product);

    saveProducts();

    displayProducts();

    alert(
      "सामान सफलतापूर्वक पोस्ट हो गया।"
    );

    clearSellForm();

    showSection("buy");

  }

}


/* =====================================================
   CLEAR SELL FORM
===================================================== */

function clearSellForm(){

  document
    .getElementById("productName").value = "";

  document
    .getElementById("price").value = "";

  document
    .getElementById("quantity").value = "";

  document
    .getElementById("sellerName").value = "";

  document
    .getElementById("sellerPhone").value = "";

  document
    .getElementById("location").value = "";

  document
    .getElementById("description").value = "";

  document
    .getElementById("productImage").value = "";

  document
    .getElementById("productVideo").value = "";

}


/* =====================================================
   BUY PRODUCT
===================================================== */

function buyProduct(id){

  const product =
    products.find(p => p.id === id);

  if(!product){

    alert("सामान नहीं मिला।");
    return;

  }


  const amount =
    Number(product.price);

  const commission =
    amount * COMMISSION_PERCENT / 100;

  const sellerAmount =
    amount - commission;


  const orderId =
    "KABADI-" +
    Date.now();


  const buyerName =
    prompt("खरीदार का नाम डालें:");

  if(!buyerName){
    return;
  }


  const buyerPhone =
    prompt("खरीदार का मोबाइल नंबर डालें:");

  if(!buyerPhone){
    return;
  }


  const buyerLocation =
    prompt("डिलीवरी लोकेशन डालें:");

  if(!buyerLocation){
    return;
  }


  const order = {

    orderId:orderId,

    productId:product.id,

    productName:product.name,

    total:amount,

    commission:commission,

    sellerAmount:sellerAmount,

    seller:product.seller,

    sellerPhone:product.phone,

    buyer:buyerName,

    buyerPhone:buyerPhone,

    buyerLocation:buyerLocation,

    status:"Payment Pending",

    created:new Date().toLocaleString("hi-IN")

  };


  localStorage.setItem(
    "lastOrder",
    JSON.stringify(order)
  );


  showOrder(order);

}


/* =====================================================
   SHOW ORDER
===================================================== */

function showOrder(order){

  document
    .querySelectorAll(".section")
    .forEach(x => x.classList.remove("active"));

  document
    .getElementById("orderSection")
    .classList.add("active");


  document
    .querySelectorAll(".menu button")
    .forEach(x => x.classList.remove("active"));


  const upiLink =
    "upi://pay" +
    "?pa=" + encodeURIComponent(OWNER_UPI) +
    "&pn=" + encodeURIComponent("Kisan Anaj Bazar") +
    "&am=" + encodeURIComponent(order.total.toFixed(2)) +
    "&cu=INR" +
    "&tn=" + encodeURIComponent(
      "Order " + order.orderId
    );


  document.getElementById("orderDetails").innerHTML = `

    <div class="order">

      <h3>ऑर्डर #${order.orderId}</h3>

      <p style="margin-top:10px">
        🌾 सामान:
        <strong>${escapeHTML(order.productName)}</strong>
      </p>

      <p style="margin-top:7px">
        💰 सामान की कीमत:
        <strong>
          ₹${order.total.toLocaleString("en-IN")}
        </strong>
      </p>

      <p style="margin-top:7px">
        💵 5% कमीशन:
        <strong>
          ₹${order.commission.toFixed(2)}
        </strong>
      </p>

      <p style="margin-top:7px">
        🧑‍🌾 विक्रेता को:
        <strong>
          ₹${order.sellerAmount.toFixed(2)}
        </strong>
      </p>

      <p style="margin-top:7px">
        👤 खरीदार:
        ${escapeHTML(order.buyer)}
      </p>

      <p style="margin-top:7px">
        📞 खरीदार:
        ${escapeHTML(order.buyerPhone)}
      </p>

      <p style="margin-top:7px">
        📍 डिलीवरी:
        ${escapeHTML(order.buyerLocation)}
      </p>

      <p style="margin-top:7px">
        <span class="status">
          ${order.status}
        </span>
      </p>

    </div>


    <div class="payment-box">

      <h3>💳 UPI Payment</h3>

      <p style="margin-top:8px">
        Payment UPI ID:
      </p>

      <strong>
        ${escapeHTML(OWNER_UPI)}
      </strong>

      <p style="margin-top:8px">
        भुगतान राशि:
        <strong>
          ₹${order.total.toFixed(2)}
        </strong>
      </p>

      <a
        href="${upiLink}"
        style="text-decoration:none"
      >

        <button class="btn">
          💳 UPI App से भुगतान करें
        </button>

      </a>


      <button
        class="btn orange"
        onclick="paymentSubmitted()"
      >
        ✅ मैंने Payment कर दिया
      </button>

    </div>


    <div class="card" style="margin-top:15px">

      <h3>📞 सहायता</h3>

      <p style="margin-top:8px">
        Payment या Order में समस्या हो तो
        Customer Support से संपर्क करें।
      </p>

      <a
        href="tel:${SUPPORT_NUMBER}"
        style="text-decoration:none"
      >

        <button class="btn blue">
          📞 ${SUPPORT_NUMBER}
        </button>

      </a>

    </div>

  `;

}


/* =====================================================
   PAYMENT SUBMITTED
===================================================== */

function paymentSubmitted(){

  const order =
    JSON.parse(
      localStorage.getItem("lastOrder")
    );

  if(!order){
    return;
  }


  order.status =
    "Payment Submitted - Verification Pending";


  localStorage.setItem(
    "lastOrder",
    JSON.stringify(order)
  );


  showOrder(order);


  alert(
    "Payment जानकारी भेज दी गई है। Payment को बैंक/पेमेंट सिस्टम से verify करना जरूरी है।"
  );

}


/* =====================================================
   SEARCH
===================================================== */

function searchProducts(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const result =
    products.filter(p =>

      p.name.toLowerCase().includes(text) ||

      p.category.toLowerCase().includes(text) ||

      p.location.toLowerCase().includes(text)

    );


  displayProducts(result);

}


/* =====================================================
   SECURITY / HTML ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

displayProducts();

</script>

</body>
</html>
