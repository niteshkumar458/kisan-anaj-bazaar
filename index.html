<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kisan Anaj Bazaar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7f5;color:#172017}
header{background:#176b35;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0002}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:21px;font-weight:800}.brand small{display:block;font-size:12px;font-weight:500;opacity:.9}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#176b35;color:#fff}
button.secondary{background:#e8eee9;color:#176b35}button.danger{background:#b3261e}
button:disabled{opacity:.55;cursor:not-allowed}
main{max-width:1100px;margin:auto;padding:18px}
.hero{background:linear-gradient(135deg,#e8f6ea,#fff);padding:22px;border-radius:18px;margin-bottom:16px}
.hero h1{font-size:30px;margin:0 0 6px}h1,h2,h3{margin-top:0}.muted{color:#667166}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.search{display:grid;grid-template-columns:1fr 180px;gap:9px;margin:16px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd5cc;border-radius:10px;background:#fff;font:inherit}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:#fff;border-radius:15px;padding:16px;box-shadow:0 2px 10px #0000000d;border:1px solid #e3e8e3}
.price{font-size:20px;font-weight:800;color:#176b35}.tag{display:inline-block;background:#edf6ee;color:#176b35;padding:4px 8px;border-radius:99px;font-size:12px}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:50}
.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}
.notice{padding:11px;border-radius:10px;background:#fff6d8;color:#6b5200;margin:10px 0}.ok{background:#e7f7eb;color:#135a2d}.err{background:#fdebea;color:#8c1d18}
.section{margin:22px 0}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cart{position:fixed;right:15px;bottom:15px;background:#176b35;color:white;border-radius:99px;padding:13px 17px;box-shadow:0 5px 20px #0003;z-index:20}
footer{text-align:center;padding:30px;color:#6b756b}.small{font-size:13px}
.admin-card{border-left:5px solid #176b35}.status-pending{color:#8a6500;font-weight:700}.status-approved{color:#176b35;font-weight:700}.status-rejected{color:#b3261e;font-weight:700}
.product-img{width:100%;height:170px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.badge{font-size:12px;padding:4px 8px;border-radius:20px;background:#eef2ee}
hr{border:0;border-top:1px solid #e4e8e4;margin:16px 0}
@media(max-width:600px){.search,.row{grid-template-columns:1fr}.hero h1{font-size:24px}.modalbox{padding:16px}}
</style>
</head>
<body>

<header>
<div class="bar">
<div class="brand">🌾 Kisan Anaj Bazaar<small>किसानों से सीधे कृषि सामान खरीदें और बेचें</small></div>
<div id="headerUser"></div>
</div>
</header>

<main>
<section class="hero">
<h1>किसान अनाज बाजार</h1>
<div class="muted">किसान अपना अनाज बेचें और खरीदार सीधे उपलब्ध सामान देखें।</div>
<div class="actions">
<button id="loginBtn">🔐 Login / Register</button>
<button id="sellBtn" class="secondary hidden">🚜 अपना सामान बेचें</button>
<button id="ordersBtn" class="secondary hidden">📦 मेरे ऑर्डर</button>
<button id="adminBtn" class="hidden">👑 Admin Panel</button>
</div>
<div id="status" class="notice hidden"></div>
</section>

<section class="section">
<div class="topline"><h2>🌾 उपलब्ध कृषि सामान</h2><span id="productCount" class="muted"></span></div>
<div class="search">
<input id="search" placeholder="🔎 जैसे धान, गेहूं, मक्का...">
<select id="category"><option value="">सभी सामान</option><option>धान</option><option>गेहूं</option><option>मक्का</option><option>दलहन</option><option>सब्जी</option><option>अन्य</option></select>
</div>
<div id="products" class="grid"></div>
</section>
</main>

<button id="cartBtn" class="cart">🛒 Cart <span id="cartCount">0</span></button>
<footer>© 2026 Kisan Anaj Bazaar</footer>

<!-- AUTH -->
<div id="authModal" class="modal hidden"><div class="modalbox">
<div class="topline"><h2 id="authTitle">Login</h2><button id="closeAuth" class="secondary">✕</button></div>
<div id="authMessage" class="notice hidden"></div>
<div id="nameField" class="field hidden"><label>नाम</label><input id="authName" placeholder="आपका नाम"></div>
<div class="field"><label>ईमेल</label><input id="authEmail" type="email" autocomplete="email" placeholder="example@gmail.com"></div>
<div class="field"><label>पासवर्ड</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="कम से कम 6 अक्षर"></div>
<div class="actions">
<button id="authSubmit">Login</button>
<button id="switchAuth" class="secondary">नया account बनाएं</button>
<button id="resetPassword" class="secondary">पासवर्ड भूल गए?</button>
</div>
</div></div>

<!-- SELL -->
<div id="sellModal" class="modal hidden"><div class="modalbox">
<div class="topline"><h2>🚜 सामान बेचें</h2><button id="closeSell" class="secondary">✕</button></div>
<div id="sellMessage" class="notice hidden"></div>
<div class="field"><label>सामान का नाम</label><input id="pName" placeholder="जैसे बासमती चावल"></div>
<div class="row">
<div class="field"><label>श्रेणी</label><select id="pCategory"><option>धान</option><option>गेहूं</option><option>मक्का</option><option>दलहन</option><option>सब्जी</option><option>अन्य</option></select></div>
<div class="field"><label>कीमत ₹/किलो</label><input id="pPrice" type="number" min="0" step="0.01"></div>
</div>
<div class="row">
<div class="field"><label>मात्रा (किलो)</label><input id="pQty" type="number" min="0" step="0.01"></div>
<div class="field"><label>मोबाइल</label><input id="pPhone" inputmode="numeric" maxlength="10"></div>
</div>
<div class="field"><label>किसान का नाम *</label><input id="pFarmer"></div>
<div class="row"><div class="field"><label>गाँव *</label><input id="pVillage"></div><div class="field"><label>शहर *</label><input id="pCity"></div></div>
<div class="row"><div class="field"><label>जिला *</label><input id="pDistrict"></div><div class="field"><label>मोबाइल *</label><input id="pPhone" inputmode="numeric" maxlength="10"></div></div>
<div class="field"><button type="button" id="liveLocationBtn" class="secondary">📍 मेरी लाइव लोकेशन भेजें</button><div id="locationMessage" class="small muted">Location permission Allow करें।</div><input id="pLat" type="hidden"><input id="pLng" type="hidden"></div>
<div class="field"><label>विवरण</label><textarea id="pDescription"></textarea></div>
<button id="postProduct">📤 सामान पोस्ट करें</button>
</div></div>

<!-- CART -->
<div id="cartModal" class="modal hidden"><div class="modalbox">
<div class="topline"><h2>🛒 Cart</h2><button id="closeCart" class="secondary">✕</button></div>
<div id="cartItems"></div><hr><h3>कुल: ₹<span id="cartTotal">0</span></h3>
<div class="field"><label>खरीदार का नाम *</label><input id="buyerName"></div>
<div class="field"><label>मोबाइल *</label><input id="buyerPhone" maxlength="10" inputmode="numeric"></div>
<div class="row"><div class="field"><label>गाँव *</label><input id="buyerVillage"></div><div class="field"><label>शहर *</label><input id="buyerCity"></div></div>
<div class="field"><label>जिला *</label><input id="buyerDistrict"></div>
<button id="placeOrder">✅ ऑर्डर भेजें</button><div id="orderMessage" class="notice hidden"></div>
</div></div>

<!-- ORDERS -->
<div id="ordersModal" class="modal hidden"><div class="modalbox">
<div class="topline"><h2>📦 मेरे ऑर्डर</h2><button id="closeOrders" class="secondary">✕</button></div>
<div id="myOrders"></div>
</div></div>

<!-- ADMIN -->
<div id="adminModal" class="modal hidden"><div class="modalbox">
<div class="topline"><h2>👑 Admin Panel</h2><button id="closeAdmin" class="secondary">✕</button></div>
<div id="adminMessage" class="notice hidden"></div>
<div id="adminBox"></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
<script>

const firebaseConfig={
apiKey:"AIzaSyDxjigog6ctxY25UFGrH7M3pYx1IN2RWSw",
authDomain:"kissan-bajar.firebaseapp.com",
projectId:"kissan-bajar",
storageBucket:"kissan-bajar.firebasestorage.app",
messagingSenderId:"629043004551",
appId:"1:629043004551:web:f484c026c838399cff6422"
};

const app=firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const onAuthStateChanged=(a,fn)=>a.onAuthStateChanged(fn);
const createUserWithEmailAndPassword=(a,e,p)=>a.createUserWithEmailAndPassword(e,p);
const signInWithEmailAndPassword=(a,e,p)=>a.signInWithEmailAndPassword(e,p);
const signOut=a=>a.signOut();
const sendPasswordResetEmail=(a,e)=>a.sendPasswordResetEmail(e);
const updateProfile=(u,data)=>u.updateProfile(data);
const collection=(d,c)=>d.collection(c);
const doc=(d,c,i)=>d.collection(c).doc(i);
const addDoc=(r,data)=>r.add(data);
const getDoc=r=>r.get();
const getDocs=r=>r.get();
const setDoc=(r,data,opts)=>r.set(data,opts||{});
const updateDoc=(r,data)=>r.update(data);
const where=(field,op,value)=>q=>q.where(field,op,value);
const orderBy=(field,direction)=>q=>q.orderBy(field,direction);
const query=(ref,...constraints)=>constraints.reduce((q,c)=>c(q),ref);
const serverTimestamp=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=id=>document.getElementById(id);
const show=e=>e.classList.remove("hidden");
const hide=e=>e.classList.add("hidden");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const email=v=>v.trim().toLowerCase();
let currentUser=null,myProfile=null,isAdmin=false,products=[],cart=[];

function msg(el,text,ok=false){el.textContent=text;el.className="notice "+(ok?"ok":"err");show(el)}
function authError(err){
 const code=typeof err==='string'?err:(err&&err.code)||'';
 const raw=typeof err==='string'?'':((err&&err.message)||'');
 const m={
  "auth/email-already-in-use":"इस ईमेल से account पहले से बना है। Login करें।",
  "auth/invalid-email":"ईमेल सही नहीं है।",
  "auth/weak-password":"पासवर्ड कम से कम 6 अक्षर का रखें।",
  "auth/invalid-credential":"ईमेल या पासवर्ड गलत है।",
  "auth/user-not-found":"इस ईमेल से account नहीं मिला।",
  "auth/wrong-password":"पासवर्ड गलत है।",
  "auth/too-many-requests":"बहुत बार कोशिश हुई है। थोड़ी देर बाद फिर कोशिश करें।",
  "auth/network-request-failed":"Internet connection की समस्या है।",
  "auth/operation-not-allowed":"Firebase में Email/Password Login enabled नहीं है।",
  "permission-denied":"Firestore Rules ने access रोक दिया है।",
  "unauthenticated":"पहले Login करें।",
  "failed-precondition":"Firestore की configuration/index समस्या है।",
  "unavailable":"Firebase अभी उपलब्ध नहीं है। Internet check करके Refresh करें।",
  "not-found":"Firestore document नहीं मिला।",
  "already-exists":"यह record पहले से मौजूद है।",
  "resource-exhausted":"Firebase limit पूरी हो गई है।",
  "deadline-exceeded":"Firebase request में बहुत समय लग गया। फिर कोशिश करें।",
  "internal":"Firebase में internal error आया है।",
  "invalid-argument":"Firebase को भेजी गई जानकारी गलत है।"
 };
 if(m[code])return m[code];
 if(raw)return 'Firebase error: '+raw;
 return 'Firebase error: असली कारण नहीं मिला।';
}
async function getMyProfile(){
if(!currentUser)return null;
const s=await getDoc(doc(db,"users",currentUser.uid));
return s.exists()?{id:s.id,...s.data()}:null;
}
async function checkAdmin(){
if(!currentUser)return false;
try{
const s=await getDoc(doc(db,"admins",currentUser.uid));
return s.exists() && s.data().active===true;
}catch(e){return false}
}
function openAuth(mode="login"){
$("authTitle").textContent=mode==="login"?"Login":"Register";
$("authSubmit").textContent=mode==="login"?"Login":"Register";
$("switchAuth").textContent=mode==="login"?"नया account बनाएं":"पहले से account है? Login";
mode==="login"?hide($("nameField")):show($("nameField"));
$("authMessage").className="notice hidden";show($("authModal"));
}
$("loginBtn").onclick=()=>currentUser?signOut(auth):openAuth("login");
$("closeAuth").onclick=()=>hide($("authModal"));
$("switchAuth").onclick=()=>openAuth($("authTitle").textContent==="Register"?"login":"register");
$("resetPassword").onclick=async()=>{
const e=email($("authEmail").value);if(!e)return msg($("authMessage"),"पहले ईमेल लिखें।");
try{await sendPasswordResetEmail(auth,e);msg($("authMessage"),"Password reset email भेज दिया गया है।",true)}
catch(x){msg($("authMessage"),authError(x.code))}
};
$("authSubmit").onclick=async()=>{
const e=email($("authEmail").value),p=$("authPassword").value;
if(!e||p.length<6)return msg($("authMessage"),"ईमेल और कम से कम 6 अक्षर का पासवर्ड भरें।");
$("authSubmit").disabled=true;
try{
if($("authTitle").textContent==="Register"){
const n=$("authName").value.trim();if(!n)return msg($("authMessage"),"नाम भरें।");
const c=await createUserWithEmailAndPassword(auth,e,p);
await updateProfile(c.user,{displayName:n});
await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name:n,email:e,role:"user",buyPermission:true,sellPermission:false,createdAt:serverTimestamp()},{merge:true});
msg($("authMessage"),"Account बन गया।",true);setTimeout(()=>hide($("authModal")),500);
}else{
await signInWithEmailAndPassword(auth,e,p);msg($("authMessage"),"Login सफल।",true);setTimeout(()=>hide($("authModal")),300);
}
}catch(x){msg($("authMessage"),authError(x.code))}finally{$("authSubmit").disabled=false}
};

$("sellBtn").onclick=async()=>{
if(!currentUser)return openAuth("login");
try{myProfile=await getMyProfile()}catch(e){return msg($("status"),authError(e))}
if(!myProfile||myProfile.sellPermission!==true)return msg($("status"),"आपको अभी सामान बेचने की permission नहीं मिली है।");
$("pFarmer").value=currentUser.displayName||myProfile.name||"";
$("pPhone").value=myProfile.phone||myProfile.mobile||"";
show($("sellModal"));
};
$("closeSell").onclick=()=>hide($("sellModal"));

$("postProduct").onclick=async()=>{
 if(!currentUser)return openAuth("login");
 try{myProfile=await getMyProfile()}catch(e){return msg($("sellMessage"),authError(e))}
 if(!myProfile||myProfile.sellPermission!==true)return msg($("sellMessage"),"Sell Permission अभी OFF है।");
 const n=$("pName").value.trim(),cat=$("pCategory").value,price=Number($("pPrice").value),qty=Number($("pQty").value),phone=$("pPhone").value.trim(),farmer=$("pFarmer").value.trim(),village=$("pVillage").value.trim(),city=$("pCity").value.trim(),district=$("pDistrict").value.trim(),lat=$("pLat").value.trim(),lng=$("pLng").value.trim();
 if(!n||price<=0||qty<=0||!farmer||!/^[0-9]{10}$/.test(phone)||!village||!city||!district)return msg($("sellMessage"),"नाम, मोबाइल, गाँव, शहर, जिला, अनाज, मात्रा और रेट सही भरें।");
 if(!lat||!lng)return msg($("sellMessage"),"पहले “📍 मेरी लाइव लोकेशन भेजें” दबाएँ।");
 $("postProduct").disabled=true;
 try{
  await addDoc(collection(db,"products"),{name:n,category:cat,price,quantity:qty,phone,farmer,village,city,district,location:{latitude:Number(lat),longitude:Number(lng)},latitude:Number(lat),longitude:Number(lng),description:$("pDescription").value.trim(),sellerId:currentUser.uid,sellerEmail:currentUser.email,status:"pending",active:false,createdAt:serverTimestamp()});
  msg($("sellMessage"),"सामान पोस्ट हो गया है। Admin approval के बाद खरीदारों को दिखाई देगा।",true);
  ["pName","pPrice","pQty","pVillage","pCity","pDistrict","pDescription","pLat","pLng"].forEach(id=>$(id).value="");
  $("locationMessage").textContent="Location भेजने के लिए Allow करें."; $("liveLocationBtn").textContent="📍 मेरी लाइव लोकेशन भेजें";
 }catch(e){msg($("sellMessage"),"सामान पोस्ट नहीं हुआ: "+authError(e))}finally{$("postProduct").disabled=false}
};

$("liveLocationBtn").onclick=()=>{
 const btn=$("liveLocationBtn"),info=$("locationMessage");
 if(!navigator.geolocation){info.textContent="इस ब्राउज़र में Live Location उपलब्ध नहीं है।";return}
 btn.disabled=true;info.textContent="📍 Location ली जा रही है...";
 navigator.geolocation.getCurrentPosition(pos=>{const lat=Number(pos.coords.latitude.toFixed(6)),lng=Number(pos.coords.longitude.toFixed(6));$("pLat").value=lat;$("pLng").value=lng;info.textContent=`✅ Location मिल गई: ${lat}, ${lng}`;btn.textContent="✅ Location मिल गई";btn.disabled=false},err=>{info.textContent="❌ Location नहीं मिली। GPS/Location Allow करके फिर कोशिश करें।";btn.disabled=false},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

async function loadProducts(){
try{
/*
  Firestore Rules only allow buyers/public users to read products
  when status == "approved" AND active == true.
  इसलिए query में भी वही conditions लगानी जरूरी हैं।
  orderBy हटाया गया है ताकि इस query के लिए composite index की
  जरूरत न पड़े; नीचे JavaScript में createdAt के अनुसार sort होगा।
*/
const s=await getDocs(
  query(
    collection(db,"products"),
    where("status","==","approved"),
    where("active","==",true)
  )
);

products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
  const at=a.createdAt?.seconds||0;
  const bt=b.createdAt?.seconds||0;
  return bt-at;
});

renderProducts();
}catch(e){
console.error("Products load error:",e);
$("products").innerHTML='<div class="card err"><b>Products load नहीं हुए।</b><p>'+esc(authError(e))+'</p><p class="small">Admin → Products में जाकर सामान का status Approved और Active करें।</p></div>';
}
}
function renderProducts(){
const term=$("search").value.trim().toLowerCase(),cat=$("category").value;
const list=products.filter(p=>(!cat||p.category===cat)&&(!term||`${p.name} ${p.category} ${p.farmer} ${p.village||""} ${p.city||""} ${p.district||""}`.toLowerCase().includes(term)));
$("productCount").textContent=list.length+" सामान";
if(!list.length){$("products").innerHTML='<div class="card"><b>अभी कोई Approved सामान उपलब्ध नहीं है।</b><p class="muted">किसान सामान पोस्ट करेंगे और Admin approval के बाद यहाँ दिखाई देगा।</p></div>';return}
$("products").innerHTML=list.map(p=>`<div class="card">
<span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3>
<div class="price">₹${Number(p.price||0).toLocaleString("en-IN")}/किलो</div>
<p>मात्रा: ${Number(p.quantity||0).toLocaleString("en-IN")} किलो</p>
<p>👨‍🌾 ${esc(p.farmer)}<br>🏘️ गाँव: ${esc(p.village||"—")}<br>🏙️ शहर: ${esc(p.city||"—")}<br>📍 जिला: ${esc(p.district||"—")}</p>${p.latitude&&p.longitude?`<p><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(p.latitude+","+p.longitude)}">📍 लोकेशन देखें</a></p>`:""}
<p class="muted small">${esc(p.description)}</p>
<button onclick="window.addToCart('${p.id}')">🛒 Cart में डालें</button>
</div>`).join("");
}
$("liveLocationBtn").onclick=()=>{const b=$("liveLocationBtn"),m=$("locationMessage");if(!navigator.geolocation){m.textContent="❌ Live Location उपलब्ध नहीं है।";return}b.disabled=true;m.textContent="📍 लोकेशन ली जा रही है...";navigator.geolocation.getCurrentPosition(pos=>{const lat=Number(pos.coords.latitude.toFixed(6)),lng=Number(pos.coords.longitude.toFixed(6));$("pLat").value=lat;$("pLng").value=lng;m.textContent=`✅ लोकेशन मिल गई: ${lat}, ${lng}`;b.textContent="✅ लाइव लोकेशन मिल गई";b.disabled=false},err=>{m.textContent="❌ Location permission/GPS की समस्या है।";b.disabled=false},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};

window.addToCart=id=>{
const p=products.find(x=>x.id===id);if(!p)return;
const old=cart.find(x=>x.id===id);if(old)old.qty++;else cart.push({...p,qty:1});
renderCart();msg($("status"),"सामान Cart में जोड़ दिया गया।",true);
};
function function loadProducts(){
try{
/*
  Firestore Rules only allow buyers/public users to read products
  when status == "approved" AND active == true.
  इसलिए query में भी वही conditions लगानी जरूरी हैं।
  orderBy हटाया गया है ताकि इस query के लिए composite index की
  जरूरत न पड़े; नीचे JavaScript में createdAt के अनुसार sort होगा।
*/
const s=await getDocs(
  query(
    collection(db,"products"),
    where("status","==","approved"),
    where("active","==",true)
  )
);

products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
  const at=a.createdAt?.seconds||0;
  const bt=b.createdAt?.seconds||0;
  return bt-at;
});

renderProducts();
}catch(e){
console.error("Products load error:",e);
$("products").innerHTML='<div class="card err"><b>Products load नहीं हुए।</b><p>'+esc(authError(e))+'</p><p class="small">Admin → Products में जाकर सामान का status Approved और Active करें।</p></div>';
}
}
function renderProducts(){
const term=$("search").value.trim().toLowerCase(),cat=$("category").value;
const list=products.filter(p=>(!cat||p.category===cat)&&(!term||`${p.name} ${p.category} ${p.farmer} ${p.village||""} ${p.city||""} ${p.district||""}`.toLowerCase().includes(term)));
$("productCount").textContent=list.length+" सामान";
if(!list.length){$("products").innerHTML='<div class="card"><b>अभी कोई Approved सामान उपलब्ध नहीं है।</b><p class="muted">किसान सामान पोस्ट करेंगे और Admin approval के बाद यहाँ दिखाई देगा।</p></div>';return}
$("products").innerHTML=list.map(p=>`<div class="card">
<span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3>
<div class="price">₹${Number(p.price||0).toLocaleString("en-IN")}/किलो</div>
<p>मात्रा: ${Number(p.quantity||0).toLocaleString("en-IN")} किलो</p>
<p>👨‍🌾 ${esc(p.farmer)}<br>🏘️ गाँव: ${esc(p.village||"—")}<br>🏙️ शहर: ${esc(p.city||"—")}<br>📍 जिला: ${esc(p.district||"—")}</p>${p.latitude&&p.longitude?`<p><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(p.latitude+","+p.longitude)}">📍 लोकेशन देखें</a></p>`:""}
<p class="muted small">${esc(p.description)}</p>
<button onclick="window.addToCart('${p.id}')">🛒 Cart में डालें</button>
</div>`).join("");
}
$("liveLocationBtn").onclick=()=>{const b=$("liveLocationBtn"),m=$("locationMessage");if(!navigator.geolocation){m.textContent="❌ Live Location उपलब्ध नहीं है।";return}b.disabled=true;m.textContent="📍 लोकेशन ली जा रही है...";navigator.geolocation.getCurrentPosition(pos=>{const lat=Number(pos.coords.latitude.toFixed(6)),lng=Number(pos.coords.longitude.toFixed(6));$("pLat").value=lat;$("pLng").value=lng;m.textContent=`✅ लोकेशन मिल गई: ${lat}, ${lng}`;b.textContent="✅ लाइव लोकेशन मिल गई";b.disabled=false},err=>{m.textContent="❌ Location permission/GPS की समस्या है।";b.disabled=false},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};

window.addToCart=id=>{
const p=products.find(x=>x.id===id);if(!p)return;
const old=cart.find(x=>x.id===id);if(old)old.qty++;else cart.push({...p,qty:1});
renderCart();msg($("status"),"सामान Cart में जोड़ दिया गया।",true);
};
async function renderCart(){
$("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0);
if(!cart.length){$("cartItems").innerHTML='<p class="muted">Cart खाली है।</p>';$("cartTotal").textContent="0";return}
let total=0;
$("cartItems").innerHTML=cart.map((x,i)=>{const t=Number(x.price)*x.qty;total+=t;return `<div class="card"><b>${esc(x.name)}</b><p>₹${x.price}/किलो × ${x.qty}</p><button class="danger" onclick="window.removeCart(${i})">हटाएं</button></div>`}).join("");
$("cartTotal").textContent=total.toLocaleString("en-IN");
}
window.removeCart=i=>{cart.splice(i,1);renderCart()};
$("cartBtn").onclick=()=>{renderCart();show($("cartModal"))};
$("closeCart").onclick=()=>hide($("cartModal"));

$("placeOrder").onclick=async()=>{
if(!currentUser)return openAuth("login");
if(!cart.length)return msg($("orderMessage"),"Cart खाली है।");
const name=$("buyerName").value.trim(),phone=$("buyerPhone").value.trim(),village=$("buyerVillage").value.trim(),city=$("buyerCity").value.trim(),district=$("buyerDistrict").value.trim();
if(!name||!/^[0-9]{10}$/.test(phone)||!village||!city||!district)return msg($("orderMessage"),"नाम, मोबाइल, गाँव, शहर और जिला भरें।");
const address=`गाँव: ${village}, शहर: ${city}, जिला: ${district}`;
$("placeOrder").disabled=true;
try{
const total=cart.reduce((a,x)=>a+Number(x.price)*x.qty,0);
const order=await addDoc(collection(db,"orders"),{buyerId:currentUser.uid,buyerName:name,buyerEmail:currentUser.email,buyerPhone:phone,buyerVillage:village,buyerCity:city,buyerDistrict:district,address,sellerIds:[...new Set(cart.map(x=>x.sellerId).filter(Boolean))],items:cart.map(x=>({productId:x.id,name:x.name,price:x.price,qty:x.qty,sellerId:x.sellerId,sellerName:x.farmer})),sellerIds:[...new Set(cart.map(x=>x.sellerId).filter(Boolean))],total,status:"booked",createdAt:serverTimestamp()});
for(const x of cart){
try{await addDoc(collection(db,"notifications"),{type:"new_order",orderId:order.id,sellerId:x.sellerId,buyerId:currentUser.uid,message:`नया order: ${x.name}`,createdAt:serverTimestamp()})}catch(_){}
}
cart=[];renderCart();msg($("orderMessage"),"Order सफलतापूर्वक भेज दिया गया है।",true);
}catch(e){msg($("orderMessage"),"Order नहीं गया: "+authError(e))}finally{$("placeOrder").disabled=false}
};

$("ordersBtn").onclick=async()=>{show($("ordersModal"));await loadOrders()};
$("closeOrders").onclick=()=>hide($("ordersModal"));
async function loadOrders(){
if(!currentUser)return;
$("myOrders").innerHTML="<p>Orders लोड हो रहे हैं...</p>";
try{
const s=await getDocs(query(collection(db,"orders"),where("buyerId","==",currentUser.uid)));
if(s.empty){$("myOrders").innerHTML='<p class="muted">अभी कोई order नहीं है।</p>';return}
const a=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
$("myOrders").innerHTML=a.map(o=>`<div class="card"><b>Order #${esc(o.id.slice(0,8))}</b><p>कुल: ₹${Number(o.total||0).toLocaleString("en-IN")}</p><p>स्थिति: <b>${esc(o.status||"booked")}</b></p><p>${esc(o.address||"")}</p><p class="small">${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join(", ")}</p></div>`).join("");
}catch(e){$("myOrders").innerHTML='<div class="notice err">'+esc(authError(e))+'</div>'}
}

async function renderAdmin(){
if(!isAdmin)return;
show($("adminModal"));
$("adminBox").innerHTML="<p>Admin data लोड हो रहा है...</p>";
try{
const ps=await getDocs(collection(db,"products"));
const users=await getDocs(collection(db,"users"));
const os=await getDocs(collection(db,"orders"));
const pending=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.status==="pending");
$("adminBox").innerHTML=`
<h3>📊 Dashboard</h3>
<div class="grid">
<div class="card"><b>कुल सामान</b><h2>${ps.size}</h2></div>
<div class="card"><b>Pending सामान</b><h2>${pending.length}</h2></div>
<div class="card"><b>Users</b><h2>${users.size}</h2></div>
<div class="card"><b>Orders</b><h2>${os.size}</h2></div>
</div>
<h3 style="margin-top:22px">🌾 Sell Requests</h3>
<div id="adminProducts"></div>
<h3 style="margin-top:22px">👤 User Permissions</h3>
<div id="adminUsers"></div>
<h3 style="margin-top:22px">📦 Orders</h3>
<div id="adminOrders"></div>`;
$("adminProducts").innerHTML=pending.length?pending.map(p=>`<div class="card admin-card">
<b>${esc(p.name)}</b> — ${esc(p.category)}<p>किसान: ${esc(p.farmer)} | मोबाइल: ${esc(p.phone)}</p><p>मात्रा: ${p.quantity} किलो | ₹${p.price}/किलो</p><p>🏘️ ${esc(p.village||"—")} | 🏙️ ${esc(p.city||"—")} | 📍 ${esc(p.district||"—")}</p>${p.latitude&&p.longitude?`<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(p.latitude+","+p.longitude)}">📍 किसान की लोकेशन देखें</a>`:""}
<button onclick="window.approveProduct('${p.id}')">✅ Approve</button>
<button class="danger" onclick="window.rejectProduct('${p.id}')">❌ Reject</button></div>`).join(""):"<p class='muted'>कोई pending request नहीं।</p>";
$("adminUsers").innerHTML=users.docs.map(d=>{const u=d.data();if(d.id===currentUser.uid)return "";return `<div class="card"><b>${esc(u.name||"नाम नहीं")}</b><p>${esc(u.email||"")}<br>Role: ${esc(u.role||"user")}</p><div class="actions"><button onclick="window.setPermission('${d.id}','sellPermission',${u.sellPermission!==true})">${u.sellPermission===true?"🚫 Sell बंद करें":"🚜 Sell ON करें"}</button><button class="secondary" onclick="window.setPermission('${d.id}','buyPermission',${u.buyPermission!==false})">${u.buyPermission===false?"🛒 Buy ON करें":"🚫 Buy बंद करें"}</button></div></div>`}).join("");
$("adminOrders").innerHTML=os.docs.length?os.docs.map(d=>{const o=d.data();return `<div class="card"><b>#${esc(d.id.slice(0,8))}</b><p>Buyer: ${esc(o.buyerName||"")} | ₹${Number(o.total||0).toLocaleString("en-IN")}</p><p>स्थिति: ${esc(o.status||"booked")}</p><select onchange="window.changeOrderStatus('${d.id}',this.value)"><option ${o.status==="booked"?"selected":""}>booked</option><option ${o.status==="approved"?"selected":""}>approved</option><option ${o.status==="pickup_scheduled"?"selected":""}>pickup_scheduled</option><option ${o.status==="picked"?"selected":""}>picked</option><option ${o.status==="advance_paid"?"selected":""}>advance_paid</option><option ${o.status==="final_paid"?"selected":""}>final_paid</option><option ${o.status==="completed"?"selected":""}>completed</option><option ${o.status==="cancelled"?"selected":""}>cancelled</option></select></div>`}).join(""):"<p class='muted'>कोई order नहीं।</p>";
}catch(e){msg($("adminMessage"),"Admin data नहीं खुला: "+authError(e))}
}
window.approveProduct=async id=>{try{await updateDoc(doc(db,"products",id),{status:"approved",active:true,approvedBy:currentUser.uid,approvedAt:serverTimestamp()});msg($("adminMessage"),"सामान Approved हो गया।",true);await loadProducts();await renderAdmin()}catch(e){msg($("adminMessage"),authError(e))}};
window.rejectProduct=async id=>{try{await updateDoc(doc(db,"products",id),{status:"rejected",active:false,rejectedBy:currentUser.uid,rejectedAt:serverTimestamp()});msg($("adminMessage"),"सामान Reject हो गया।",true);await renderAdmin()}catch(e){msg($("adminMessage"),authError(e))}};
window.setPermission=async(uid,field,value)=>{try{await updateDoc(doc(db,"users",uid),{[field]:value});msg($("adminMessage"),"Permission अपडेट हो गई।",true);await renderAdmin()}catch(e){msg($("adminMessage"),authError(e))}};
window.changeOrderStatus=async(id,value)=>{try{await updateDoc(doc(db,"orders",id),{status:value,updatedAt:serverTimestamp(),updatedBy:currentUser.uid});msg($("adminMessage"),"Order status अपडेट हो गया।",true)}catch(e){msg($("adminMessage"),authError(e))}};
$("adminBtn").onclick=renderAdmin;$("closeAdmin").onclick=()=>hide($("adminModal"));
$("search").oninput=renderProducts;$("category").onchange=renderProducts;

onAuthStateChanged(auth,async user=>{
currentUser=user;myProfile=null;isAdmin=false;
if(user){
try{myProfile=await getMyProfile();isAdmin=await checkAdmin()}catch(e){}
$("loginBtn").textContent="🚪 Logout";
show($("sellBtn"));show($("ordersBtn"));
if(isAdmin)show($("adminBtn"));else hide($("adminBtn"));
$("headerUser").innerHTML=`<span class="small">👤 ${esc(user.displayName||user.email||"User")}</span>`;
}else{
$("loginBtn").textContent="🔐 Login / Register";hide($("sellBtn"));hide($("ordersBtn"));hide($("adminBtn"));$("headerUser").innerHTML="";
}
});

loadProducts();
renderCart();
</script>
</body>
</html>
