<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>किसान अनाज बाजार</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.38)),
    url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80")
    center/cover fixed;
  color:#222;
}

/* HEADER */
header{
  background:rgba(0,100,35,.92);
  color:white;
  padding:18px 12px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}

header h1{
  font-size:27px;
}

header p{
  margin-top:5px;
  font-size:14px;
}

/* HOME */
.home{
  max-width:520px;
  margin:45px auto;
  padding:20px;
}

.home-box{
  background:rgba(255,255,255,.94);
  border-radius:20px;
  padding:25px 18px;
  box-shadow:0 5px 25px rgba(0,0,0,.3);
  text-align:center;
}

.home-box h2{
  color:#08752e;
  margin-bottom:25px;
}

.main-btn{
  width:100%;
  padding:18px;
  margin:9px 0;
  border:none;
  border-radius:14px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:#08752e;
  box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.main-btn:active{
  transform:scale(.98);
}

/* PANELS */
.panel{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:#f5f7f5;
  overflow-y:auto;
}

.panel.active{
  display:block;
}

.panel-header{
  position:sticky;
  top:0;
  z-index:10;
  background:#08752e;
  color:white;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panel-header h2{
  font-size:20px;
}

.close-btn{
  border:none;
  background:white;
  color:#08752e;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:23px;
  cursor:pointer;
}

.content{
  max-width:700px;
  margin:auto;
  padding:18px;
}

/* CARD */
.card{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.card h3{
  color:#08752e;
  margin-bottom:14px;
}

/* FORM */
label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:5px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.action-btn{
  width:100%;
  border:none;
  border-radius:11px;
  padding:14px;
  margin-top:15px;
  background:#08752e;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.secondary-btn{
  background:#555;
}

.location-btn{
  background:#1769aa;
}

.upi-btn{
  background:#673ab7;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  background:#e8f5e9;
  color:#176b2c;
  display:none;
}

/* CATEGORY */
.category-grid,
.variety-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.category-btn,
.variety-btn{
  border:2px solid #08752e;
  background:white;
  color:#08752e;
  border-radius:12px;
  padding:15px 8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.category-btn.active,
.variety-btn.active{
  background:#08752e;
  color:white;
}

.product-info{
  display:none;
  margin-top:18px;
  padding:15px;
  background:#f0f8f1;
  border-radius:12px;
}

.product-photo{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
}

.price{
  color:#08752e;
  font-size:22px;
  font-weight:bold;
  margin-top:8px;
}

/* LOCATION */
.location-box{
  background:#eef7ff;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
  font-size:14px;
  word-break:break-word;
}

/* FOOTER */
.footer{
  text-align:center;
  color:white;
  padding:20px;
  font-size:13px;
}

/* MOBILE */
@media(max-width:500px){
  header h1{
    font-size:23px;
  }

  .home{
    margin:25px auto;
  }

  .category-grid,
  .variety-grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>🌾 किसान अनाज बाजार</h1>
  <p>किसान से ग्राहक तक सीधे कृषि उत्पाद</p>
</header>


<!-- HOME -->
<section class="home">

    <h2>आप क्या करना चाहते हैं?</h2>

    <button class="main-btn" onclick="openPanel('buyPanel')">
      🛒 सामान खरीदें

    <button class="main-btn" onclick="openPanel('sellPanel')">
      🌾 सामान बेचें
    </button>

    <button class="main-btn" onclick="openPanel('supportPanel')">
      💬 Customer Support
    </button>

</section>


<!-- BUY PANEL -->
<section id="buyPanel" class="panel">

  <div class="panel-header">
    <h2>🛒 सामान खरीदें</h2>
    <button class="close-btn" onclick="closePanel('buyPanel')">×</button>
  </div>

  <div class="content">

    <div class="card">

      <div id="categoryGrid" class="category-grid"></div>

    </div>


    <div id="varietyCard" class="card" style="display:none;">

    </div>


    <div id="productInfo" class="card product-info">

      <h3>3️⃣ सामान की जानकारी</h3>

      <div id="selectedProductName"></div>

      <div id="selectedProductPrice" class="price"></div>

      <img id="selectedProductPhoto"

      <hr style="margin:15px 0;border:none;border-top:1px solid #ddd;">

      <h3>ऑर्डर की जानकारी</h3>

      <label>आपका नाम</label>

      <label>मोबाइल नंबर</label>
      <input id="buyerPhone" type="tel" placeholder="10 अंकों का मोबाइल नंबर">

      <label>पूरा पता</label>
      <textarea id="buyerAddress"

      <select id="buyerUnit">

        <option value="टन">टन</option>

      </select>

</section>

<section id="sellPanel" class="panel">

  <div class="panel-header">

  </div>

  <div class="content">

    <div class="card">

      <select id="sellerCategory">

<!-- CUSTOMER SUPPORT -->
<section id="supportPanel" class="panel">

  <div class="panel-header">
    <h2>💬 Customer Support</h2>
    <button class="close-btn" onclick="closePanel('supportPanel')">×</button>
  </div>

  <div class="content">

    <div class="card">

      <h3>हमसे संपर्क करें</h3>

             type="tel"

</section>


<div class="footer">

<!-- IMPORTANT:

<script>

function openPanel(id){

  const panel = document.getElementById(id);

  if(!panel){
    alert("Panel नहीं मिला: " + id);
    return;
  }

  panel.classList.add("active");

  document.body.style.overflow = "hidden";

}


function closePanel(id){

  const panel = document.getElementById(id);

  if(!panel){
    return;
  }

  panel.classList.remove("active");

  document.body.style.overflow = "";

}

</script>

/* SAFE MESSAGE */

function showMessage(id,text){

  const box = document.getElementById(id);

  if(!box) return;

  box.innerText = text;

  box.style.display = "block";

}


/* LOAD PRODUCTS */

async function loadProducts(){

  if(!firebaseReady){

    renderCategories();

    return;

  }

  try{

    const snapshot =
      await getDocs(collection(db,"products"));

    if(snapshot.empty){

      renderCategories();

      return;

    }

    products = [];

    snapshot.forEach(doc => {

      products.push({
        id:doc.id,
        ...doc.data()
      });

    });

    renderCategories();

  }catch(error){

    console.error(error);

    renderCategories();

  }

}


/* CATEGORY */

function renderCategories(){

  const grid =
    document.getElementById("categoryGrid");

  const sellerCategory =
    document.getElementById("sellerCategory");

  if(!grid) return;

  const categories =
    [...new Set(products.map(p => p.category).filter(Boolean))];

  grid.innerHTML = "";

  sellerCategory.innerHTML =
    '<option value="">Category चुनें</option>';


  categories.forEach(category => {

    const btn =
      document.createElement("button");

    btn.className = "category-btn";

    btn.innerText = category;

    btn.onclick = () =>
      selectCategory(category,btn);

    grid.appendChild(btn);


    const option =
      document.createElement("option");

    option.value = category;

    option.innerText = category;

    sellerCategory.appendChild(option);

  });

}


/* SELECT CATEGORY */

function selectCategory(category,button){

  document
    .querySelectorAll(".category-btn")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");


  const varieties =
    products.filter(
      p => p.category === category
    );


  const grid =
    document.getElementById("varietyGrid");

  grid.innerHTML = "";


  varieties.forEach(product => {

    const btn =
      document.createElement("button");

    btn.className = "variety-btn";

    btn.innerText = product.variety;

    btn.onclick = () =>
      selectProduct(product,btn);

    grid.appendChild(btn);

  });


  document.getElementById("varietyCard")
    .style.display = "block";


  document.getElementById("productInfo")
    .style.display = "none";

}


/* SELECT PRODUCT */

function selectProduct(product,button){

  selectedProduct = product;


  document
    .querySelectorAll(".variety-btn")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");


  document.getElementById("productInfo")
    .style.display = "block";


  document.getElementById("selectedProductName")
    .innerHTML =
    "<b>" +
    escapeHTML(product.category) +
    "</b> → " +
    escapeHTML(product.variety);


  document.getElementById("selectedProductPrice")
    .innerText =
    "₹" +
    (product.price || 0) +
    " / " +
    (product.unit || "किलो");


  const img =
    document.getElementById("selectedProductPhoto");


  if(product.photoURL){

    img.src = product.photoURL;

    img.style.display = "block";

  }else{

    img.style.display = "none";

  }

}


/* BUYER LOCATION */

window.getBuyerLocation = function(){

  if(!navigator.geolocation){

    alert("आपके browser में location उपलब्ध नहीं है.");

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      buyerLat =
        position.coords.latitude;

      buyerLng =
        position.coords.longitude;


      const maps =
        "https://www.google.com/maps?q=" +
        buyerLat + "," + buyerLng;


      const box =
        document.getElementById("buyerLocation");


      box.style.display = "block";

      box.innerHTML =
        "📍 Location मिल गई<br>" +
        '<a href="' +
        maps +
        '" target="_blank">Google Maps पर देखें</a>';

    },

    error => {

      alert(
        "Location नहीं मिल सकी। Browser में Location Permission Allow करें."
      );

    }

  );

};

};


/* FILE UPLOAD */

async function uploadFile(file,folder){

  if(!file || !storage){

    return "";

  }


  const fileName =
    Date.now() +
    "_" +
    file.name.replace(/[^a-zA-Z0-9._-]/g,"_");


  const storageRef =
    ref(
      storage,
      folder + "/" + fileName
    );


  await uploadBytes(storageRef,file);

  return await getDownloadURL(storageRef);

}


/* PLACE ORDER */

    return;

  }


  let photoURL = "";


  try{

    if(photo){

      photoURL =
        await uploadFile(
          photo,
          "buyerPhotos"
        );

    }


    const orderData = {

      buyerLatitude:buyerLat,

      buyerLongitude:buyerLng,

      buyerMaps:
        buyerLat && buyerLng
