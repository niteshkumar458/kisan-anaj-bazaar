<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nitesh Industry</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,sans-serif;
      background:#f5f6f8;
      color:#222;
    }
    header{
      background:#111827;
      color:white;
      padding:18px;
      position:sticky;
      top:0;
      z-index:10;
    }
    .header-box{
      max-width:1100px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .logo{
      font-size:24px;
      font-weight:bold;
    }
    .cart-btn{
      background:#f59e0b;
      border:0;
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }
    .hero{
      background:#2563eb;
      color:white;
      text-align:center;
      padding:45px 20px;
    }
    .hero h1{font-size:35px;margin-bottom:10px}
    .hero p{font-size:17px}
    .container{
      max-width:1100px;
      margin:25px auto;
      padding:0 15px;
    }
    .search{
      width:100%;
      padding:14px;
      border:1px solid #ddd;
      border-radius:8px;
      margin-bottom:20px;
      font-size:16px;
    }
    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
    }
    .product{
      background:white;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 2px 10px #0001;
    }
    .product img{
      width:100%;
      height:180px;
      object-fit:cover;
      background:#ddd;
    }
    .product-info{padding:15px}
    .product h3{margin-bottom:8px}
    .price{
      font-size:20px;
      font-weight:bold;
      margin:8px 0;
    }
    .btn{
      width:100%;
      padding:11px;
      border:0;
      border-radius:7px;
      cursor:pointer;
      font-weight:bold;
    }
    .add{background:#16a34a;color:white}
    .section{
      background:white;
      padding:20px;
      margin-top:25px;
      border-radius:12px;
      box-shadow:0 2px 10px #0001;
    }
    .section h2{margin-bottom:15px}
    input,textarea,select{
      width:100%;
      padding:12px;
      margin:7px 0;
      border:1px solid #ddd;
      border-radius:7px;
      font-size:15px;
    }
    textarea{min-height:80px}
    .submit{
      background:#2563eb;
      color:white;
      margin-top:10px;
    }
    .cart-item{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:12px 0;
      border-bottom:1px solid #eee;
    }
    .remove{
      background:#dc2626;
      color:white;
      border:0;
      padding:5px 9px;
      border-radius:5px;
      cursor:pointer;
    }
    .total{
      font-size:20px;
      font-weight:bold;
      margin-top:15px;
    }
    .admin{
      background:#111827;
      color:white;
    }
    .order{
      background:white;
      color:#222;
      padding:15px;
      border-radius:10px;
      margin:12px 0;
    }
    .status{
      display:inline-block;
      padding:5px 9px;
      border-radius:5px;
      background:#f59e0b;
      margin:7px 0;
      font-weight:bold;
    }
    .order button{
      padding:8px 12px;
      margin:4px;
      border:0;
      border-radius:6px;
      cursor:pointer;
    }
    .confirm{background:#16a34a;color:white}
    .delivery{background:#2563eb;color:white}
    .delivered{background:#7c3aed;color:white}
    .cancel{background:#dc2626;color:white}
    footer{
      text-align:center;
      padding:25px;
      margin-top:30px;
      background:#111827;
      color:white;
    }
    @media(max-width:600px){
      .hero h1{font-size:28px}
      .header-box{flex-direction:column}
    }
  </style>
</head>

<body>

<header>
  <div class="header-box">
    <div class="logo">🏭 Nitesh Industry</div>
    <button class="cart-btn" onclick="goCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</header>

<section class="hero">
  <h1>Nitesh Industry</h1>
  <p>आपकी जरूरत का सामान आसान तरीके से ऑनलाइन ऑर्डर करें</p>
</section>

<div class="container">

  <!-- SEARCH -->
  <section class="section">
    <h2>🔎 सामान खोजें</h2>
    <input
      id="search"
      class="search"
      type="text"
      placeholder="जैसे Blanket, कपड़े, सामान..."
      oninput="showProducts()"
    >
  </section>

  <!-- PRODUCTS -->
  <section class="section">
    <h2>🛍️ हमारे Products</h2>
    <div id="products" class="products">
      <p>Products लोड हो रहे हैं...</p>
    </div>
  </section>

  <!-- CART -->
  <section class="section" id="cartSection">
    <h2>🛒 आपका Cart</h2>
    <div id="cart"></div>
    <div class="total">
      कुल: ₹<span id="total">0</span>
    </div>
  </section>

  <!-- ORDER FORM -->
  <section class="section">
    <h2>📦 Order करें</h2>

    <input id="customerName" placeholder="आपका नाम">
    <input id="customerPhone" placeholder="मोबाइल नंबर" maxlength="10">
    <textarea id="address" placeholder="पूरा Delivery Address"></textarea>

    <select id="payment">
      <option value="COD">💵 Cash on Delivery</option>
      <option value="UPI">📱 UPI Payment</option>
    </select>

    <button class="btn submit" onclick="placeOrder()">
      ✅ Order भेजें
    </button>

    <p id="orderMessage" style="margin-top:10px"></p>
  </section>

  <!-- ADMIN -->
  <section class="section admin">
    <h2>👨‍💼 Admin Panel</h2>
    <p>यहाँ आपके आने वाले Orders दिखाई देंगे।</p>

    <input
      id="adminPassword"
      type="password"
      placeholder="Admin Password"
    >

    <button class="btn submit" onclick="openAdmin()">
      🔐 Orders देखें
    </button>

    <div id="adminOrders"></div>
  </section>

</div>

<footer>
  © 2026 Nitesh Industry — All Rights Reserved
</footer>

<script type="module">

/* ============================
   FIREBASE
============================ */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  doc,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* अपनी Firebase जानकारी यहाँ डालें */

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* ============================
   PRODUCTS
============================ */

let products = [];

let demoProducts = [
  {
    id:"demo1",
    name:"Premium Blanket",
    price:799,
    category:"Blanket",
    image:"https://images.unsplash.com/photo-1584100936595-c0654b55a2e2"
  },
  {
    id:"demo2",
    name:"Cotton Blanket",
    price:599,
    category:"Blanket",
    image:"https://images.unsplash.com/photo-1600369671236-e74521d5b245"
  },
  {
    id:"demo3",
    name:"Winter Blanket",
    price:999,
    category:"Blanket",
    image:"https://images.unsplash.com/photo-1578898887932-dce23a595ad4"
  }
];

async function loadProducts(){

  try{

    const snapshot =
      await getDocs(collection(db,"products"));

    products = [];

    snapshot.forEach(item => {

      products.push({
        id:item.id,
        ...item.data()
      });

    });

    if(products.length === 0){
      products = demoProducts;
    }

  }catch(error){

    console.log(error);

    products = demoProducts;

  }

  showProducts();
}


/* ============================
   SHOW PRODUCTS
============================ */

window.showProducts = function(){

  const box =
    document.getElementById("products");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase();

  const filtered =
    products.filter(p =>
      (p.name || "")
      .toLowerCase()
      .includes(search)
    );

  box.innerHTML = "";

  if(filtered.length === 0){

    box.innerHTML =
      "<p>❌ कोई Product नहीं मिला।</p>";

    return;
  }

  filtered.forEach(product => {

    box.innerHTML += `

      <div class="product">

        <img
          src="${product.image || 'https://via.placeholder.com/500'}"
          alt="${product.name}"
        >

        <div class="product-info">

          <h3>${product.name}</h3>

          <p>${product.category || ""}</p>

          <div class="price">
            ₹${product.price}
          </div>

          <button
            class="btn add"
            onclick="addToCart('${product.id}')"
          >
            🛒 Cart में डालें
          </button>

        </div>

      </div>

    `;

  });

}


/* ============================
   CART
============================ */

let cart = [];

window.addToCart = function(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  cart.push(product);

  updateCart();

  alert("✅ Product Cart में जोड़ दिया गया");

};


function updateCart(){

  document.getElementById("cartCount")
    .innerText = cart.length;

  const box =
    document.getElementById("cart");

  box.innerHTML = "";

  let total = 0;

  cart.forEach((item,index)=>{

    total += Number(item.price);

    box.innerHTML += `

      <div class="cart-item">

        <div>
          <b>${item.name}</b><br>
          ₹${item.price}
        </div>

        <button
          class="remove"
          onclick="removeCart(${index})"
        >
          हटाएँ
        </button>

      </div>

    `;

  });

  document.getElementById("total")
    .innerText = total;

}


window.removeCart = function(index){

  cart.splice(index,1);

  updateCart();

};


window.goCart = function(){

  document.getElementById("cartSection")
    .scrollIntoView({
      behavior:"smooth"
    });

};


/* ============================
   PLACE ORDER
============================ */

window.placeOrder = async function(){

  if(cart.length === 0){

    alert("पहले Cart में Product डालें");

    return;
  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const payment =
    document.getElementById("payment").value;

  if(!name || !phone || !address){

    alert("कृपया सभी जानकारी भरें");

    return;
  }

  if(phone.length !== 10){

    alert("सही 10 digit मोबाइल नंबर डालें");

    return;
  }


  const total =
    cart.reduce(
      (sum,item) => sum + Number(item.price),
      0
    );


  const order = {

    customerName:name,

    customerPhone:phone,

    address:address,

    payment:payment,

    products:cart.map(item => ({

      name:item.name,

      price:item.price,

      productId:item.id

    })),

    total:total,

    status:"Pending",

    createdAt:new Date().toISOString()

  };


  try{

    await addDoc(
      collection(db,"orders"),
      order
    );


    document.getElementById("orderMessage")
      .innerText =
      "✅ आपका Order सफलतापूर्वक भेज दिया गया है।";


    cart = [];

    updateCart();

    document.getElementById("customerName").value="";
    document.getElementById("customerPhone").value="";
    document.getElementById("address").value="";


  }catch(error){

    console.error(error);

    alert(
      "❌ Order नहीं गया। Firebase Rules/Config चेक करें।"
    );

  }

};


/* ============================
   ADMIN PANEL
============================ */

const ADMIN_PASSWORD = "123456";


window.openAdmin = async function(){

  const password =
    document.getElementById("adminPassword").value;

  if(password !== ADMIN_PASSWORD){

    alert("❌ गलत Admin Password");

    return;
  }

  const box =
    document.getElementById("adminOrders");

  box.innerHTML =
    "<p>Orders लोड हो रहे हैं...</p>";


  try{

    const q =
      query(
        collection(db,"orders"),
        orderBy("createdAt","desc")
      );

    const snapshot =
      await getDocs(q);

    box.innerHTML = "";

    if(snapshot.empty){

      box.innerHTML =
        "<p>अभी कोई Order नहीं है।</p>";

      return;
    }


    snapshot.forEach(item => {

      const order =
        item.data();

      let productsHTML = "";

      (order.products || [])
        .forEach(product => {

          productsHTML +=
            `<li>${product.name} — ₹${product.price}</li>`;

        });


      box.innerHTML += `

        <div class="order">

          <h3>📦 Order</h3>

          <p>
            <b>नाम:</b>
            ${order.customerName}
          </p>

          <p>
            <b>मोबाइल:</b>
            ${order.customerPhone}
          </p>

          <p>
            <b>पता:</b>
            ${order.address}
          </p>

          <p>
            <b>Payment:</b>
            ${order.payment}
          </p>

          <p>
            <b>Products:</b>
          </p>

          <ul>
            ${productsHTML}
          </ul>

          <p>
            <b>Total:</b>
            ₹${order.total}
          </p>

          <div class="status">
            Status: ${order.status}
          </div>

          <br>

          <button
            class="confirm"
            onclick="changeStatus('${item.id}','Confirmed')"
          >
            ✅ Confirm
          </button>

          <button
            class="delivery"
            onclick="changeStatus('${item.id}','Out for Delivery')"
          >
            🚚 Out for Delivery
          </button>

          <button
            class="delivered"
            onclick="changeStatus('${item.id}','Delivered')"
          >
            📦 Delivered
          </button>

          <button
            class="cancel"
            onclick="changeStatus('${item.id}','Cancelled')"
          >
            ❌ Cancel
          </button>

        </div>

      `;

    });


  }catch(error){

    console.error(error);

    box.innerHTML =
      "<p>❌ Orders लोड नहीं हुए। Firebase Rules चेक करें।";

  }

};


/* ============================
   CHANGE ORDER STATUS
============================ */

window.changeStatus = async function(
  orderId,
  status
){

  try{

    await updateDoc(
      doc(db,"orders",orderId),
      {
        status:status
      }
    );

    alert(
      "✅ Order status बदल दिया गया: " + status
    );

    openAdmin();

  }catch(error){

    console.error(error);

    alert(
      "❌ Status update नहीं हुआ"
    );

  }

};


loadProducts();

</script>

</body>
</html>
